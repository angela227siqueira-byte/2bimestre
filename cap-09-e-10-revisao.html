<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Processos de Independência nas Américas e Brasil Império · 30 questões (V/F)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 12px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
        }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .options { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .opt-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
        }
        .opt-btn:hover { background: #dce8e0; }
        .opt-btn.selected { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; margin: 20px 0 10px; }
        .tool-btn {
            background: #ecf3ef; border: 1px solid #b3cdbf; padding: 12px; font-size: 1rem;
            border-radius: 48px; flex: 1; text-align: center; cursor: pointer;
        }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { font-size: 0.85rem; margin-bottom: 8px; color: #1a5e44; text-align: right; }
        .font-controls { display: flex; gap: 8px; margin-bottom: 15px; justify-content: flex-end; }
        .font-btn {
            background: #e6f0ea; border: none; padding: 6px 12px; border-radius: 40px; cursor: pointer; font-weight: bold;
        }
        .result-screen { text-align: center; }
        .result-box { background: #f0f7f3; padding: 20px; border-radius: 28px; margin: 20px 0; }
        .restart-btn {
            background: #1a5e44; color: white; border: none; padding: 14px; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 10px;
        }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        .hidden { display: none; }
        @media (max-width: 640px) { .quiz-wrapper { max-width: 100%; padding: 15px; } .opt-btn { padding: 8px 16px; } }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen active">
        <div class="font-controls">
            <button class="font-btn" id="fontMinus">A−</button>
            <button class="font-btn" id="fontPlus">A+</button>
            <button class="font-btn" id="fullscreenBtn">⛶ Tela cheia</button>
        </div>
        <div class="title">📜 Independências da América e Brasil Império</div>
        <div class="sub">Capítulos 9 e 10 – 30 afirmações para julgar VERDADEIRO ou FALSO</div>
        <div class="progress" id="progressText">Questão 1 de 30</div>
        <div id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsArea">
                <button class="opt-btn" data-value="true">✅ Verdadeiro</button>
                <button class="opt-btn" data-value="false">❌ Falso</button>
            </div>
            <div class="feedback hidden" id="feedbackArea"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    // =================== 30 QUESTÕES (Verdadeiro/Falso) ===================
    const questions = [
        // --- BLOCO 1: Independências da América (EUA e América Espanhola) ---
        {
            text: "As ideias iluministas que influenciaram as independências americanas defendiam o absolutismo monárquico e a divisão estamental da sociedade.",
            correct: false,
            justification: "O Iluminismo criticava exatamente o absolutismo monárquico e a divisão estamental, defendendo a liberdade, a igualdade jurídica e a soberania popular."
        },
        {
            text: "A Guerra dos Sete Anos (1756-1763) fortaleceu a economia da metrópole britânica, que reduziu impostos sobre as Treze Colônias.",
            correct: false,
            justification: "Ao contrário: a guerra endividou a Inglaterra, que passou a cobrar mais impostos e reforçar o controle sobre as colônias, gerando insatisfação."
        },
        {
            text: "A Declaração de Independência dos Estados Unidos, aprovada em 4 de julho de 1776, teve como principal redator Thomas Jefferson e foi inspirada nas ideias de John Locke.",
            correct: true,
            justification: "Thomas Jefferson liderou a comissão que redigiu o documento, fortemente influenciado pelas ideias liberais de Locke sobre direitos naturais e contrato social."
        },
        {
            text: "A Constituição dos Estados Unidos (1787) estabeleceu uma república federativa com separação em três poderes: Executivo, Legislativo e Judiciário.",
            correct: true,
            justification: "A Constituição criou a república federativa com três poderes independentes (freios e contrapesos), sendo o primeiro presidente George Washington."
        },
        {
            text: "A independência dos EUA foi reconhecida pela Inglaterra em 1776, logo após a Declaração de Independência.",
            correct: false,
            justification: "O reconhecimento formal ocorreu apenas em 1783, pelo Tratado de Paris, após a vitória militar dos colonos com apoio francês e espanhol."
        },
        {
            text: "As Reformas Bourbônicas, promovidas pela Coroa espanhola no século XVIII, reduziram os impostos coloniais e ampliaram a autonomia das elites criollas.",
            correct: false,
            justification: "As reformas aumentaram os impostos e o controle metropolitano sobre as colônias, gerando descontentamento tanto da elite criolla quanto das camadas populares."
        },
        {
            text: "A invasão da Espanha por Napoleão Bonaparte em 1808 e a prisão do rei Fernando VII criaram um vácuo de poder que favoreceu os movimentos de independência na América Espanhola.",
            correct: true,
            justification: "Com o rei preso, formaram-se juntas de governo nas colônias que, inicialmente leais ao rei deposto, evoluíram para movimentos de independência."
        },
        {
            text: "No México, a independência foi liderada exclusivamente pela elite criolla, sem participação popular.",
            correct: false,
            justification: "Os padres Miguel Hidalgo e José María Morelos lideraram milhares de indígenas e mestiços. Após serem derrotados, a elite criolla concluiu a independência com Agustín de Iturbide em 1821."
        },
        {
            text: "Após as independências, a maior parte dos países latino-americanos adotou a república como forma de governo, com exceção do Brasil, que manteve a monarquia.",
            correct: true,
            justification: "Enquanto as ex-colônias espanholas e os EUA adotaram repúblicas, o Brasil singularizou-se ao manter a monarquia e a dinastia de Bragança no poder."
        },
        {
            text: "O haitianismo foi o medo que as elites escravistas americanas tinham de que ocorressem revoltas de escravizados semelhantes à do Haiti.",
            correct: true,
            justification: "A independência do Haiti, liderada por escravizados, gerou pânico entre as elites escravistas da América, que temiam levantes semelhantes em seus territórios."
        },
        // --- BLOCO 2: Independência do Brasil e Primeiro Reinado ---
        {
            text: "Com a transferência da Corte portuguesa para o Rio de Janeiro em 1808, o Brasil deixou oficialmente de ser colônia e tornou-se sede do Império Português.",
            correct: true,
            justification: "A vinda da família real transformou o Rio de Janeiro em capital do império, pondo fim ao pacto colonial e abrindo os portos às nações amigas."
        },
        {
            text: "A Revolução Pernambucana de 1817 foi um movimento republicano que contestou o domínio de D. João VI e os altos impostos cobrados na região.",
            correct: true,
            justification: "Comerciantes, proprietários, clérigos e militares proclamaram uma república em Pernambuco, mas o movimento foi violentamente reprimido em pouco mais de dois meses."
        },
        {
            text: "O decreto do 'Cumpra-se' determinava que as leis aprovadas pelas Cortes de Lisboa só teriam validade no Brasil após aprovação de D. Pedro.",
            correct: true,
            justification: "Em maio de 1822, D. Pedro decretou que as leis portuguesas só vigorariam no Brasil com sua autorização, reforçando a autonomia brasileira."
        },
        {
            text: "A independência do Brasil foi proclamada em 7 de setembro de 1822 e foi imediatamente aceita em todas as províncias, sem conflitos armados.",
            correct: false,
            justification: "Houve resistência armada em províncias como Bahia, Piauí, Maranhão, Pará e Cisplatina, com combates que se estenderam até 1823."
        },
        {
            text: "A independência do Brasil é celebrada em 2 de julho na Bahia porque somente nessa data ocorreu a derrota final das tropas portuguesas em Salvador e Itaparica.",
            correct: true,
            justification: "A data marca o fim da Guerra de Independência na Bahia, com a expulsão definitiva das tropas portuguesas."
        },
        {
            text: "A Constituição de 1824, outorgada por D. Pedro I, criou o Poder Moderador, que permitia ao imperador dissolver a Câmara dos Deputados e nomear juízes e senadores.",
            correct: true,
            justification: "O Poder Moderador dava ao imperador amplos poderes sobre os demais, incluindo vetar leis, dissolver a Câmara e nomear senadores e juízes."
        },
        {
            text: "A Confederação do Equador (1824) foi um movimento republicano e federalista que contestava o autoritarismo do imperador e a centralização do poder.",
            correct: true,
            justification: "Liderada por frei Caneca em Pernambuco, proclamou uma república federalista. Foi duramente reprimida e seu líder executado."
        },
        // --- BLOCO 3: Período Regencial ---
        {
            text: "O Ato Adicional de 1834 criou assembleias provinciais, extinguiu o Conselho de Estado e substituiu a regência trina por una.",
            correct: true,
            justification: "O Ato Adicional foi uma reforma constitucional que descentralizou parcialmente o poder durante o Período Regencial."
        },
        {
            text: "A Revolta dos Malês (1835), ocorrida em Salvador, foi um levante de escravizados e libertos islamizados que contestavam a escravidão.",
            correct: true,
            justification: "A palavra malê designava africanos de fé islâmica. O levante uniu escravizados e libertos na luta contra a escravidão."
        },
        {
            text: "A Revolução Farroupilha (1835-1845) foi um movimento popular liderado por escravizados no Maranhão.",
            correct: false,
            justification: "A Farroupilha ocorreu no Rio Grande do Sul, liderada pela elite gaúcha. A Balaiada foi a revolta popular no Maranhão."
        },
        {
            text: "A Cabanagem (1835-1840) foi uma revolta no Grão-Pará com participação de indígenas, mestiços e negros, que chegou a tomar Belém e foi reprimida com cerca de 30 mil mortos.",
            correct: true,
            justification: "Liderada pelos cabanos (pobres de cabanas), tomou a capital paraense e sofreu uma das mais violentas repressões do período regencial."
        },
        {
            text: "A Balaiada (1838-1841) foi um movimento popular no Maranhão que contou com a liderança de Preto Cosme, que comandou um quilombo com mais de 3 mil pessoas e uma escola.",
            correct: true,
            justification: "Cosme Bento das Chagas (Preto Cosme) liderou um quilombo com milhares de pessoas e mantinha uma escola para os quilombolas."
        },
        // --- BLOCO 4: Segundo Reinado ---
        {
            text: "O Golpe da Maioridade (1840) antecipou a coroação de D. Pedro II, que tinha 15 anos, e marcou o início do Segundo Reinado.",
            correct: true,
            justification: "Liberais promoveram a antecipação da maioridade para encerrar o período regencial. D. Pedro II foi coroado em 1841."
        },
        {
            text: "Durante o Segundo Reinado, o Partido Liberal e o Partido Conservador partilhavam a origem social, a formação educacional e os métodos para obter votos, como violência e distribuição de favores.",
            correct: true,
            justification: "Liberais (luzias) e conservadores (saquaremas) tinham mais semelhanças que diferenças, incluindo práticas clientelistas e violentas."
        },
        {
            text: "A Lei de Terras de 1850 facilitou o acesso de negros libertos, imigrantes e pequenos agricultores à terra no Brasil Imperial.",
            correct: false,
            justification: "A Lei de Terras dificultou o acesso à terra para esses grupos, pois exigia compra com pagamento de taxas inacessíveis para a maioria."
        },
        {
            text: "A construção da identidade nacional no Brasil Império idealizava o indígena e apagava a importância dos povos africanos e da escravidão no discurso oficial.",
            correct: true,
            justification: "O IHGB promovia uma história oficial que exaltava o indígena idealizado (indianismo) e omitia o papel dos africanos e da escravidão."
        },
        {
            text: "A Lei Eusébio de Queirós (1850) proibiu o tráfico transatlântico de africanos escravizados para o Brasil.",
            correct: true,
            justification: "Sob pressão britânica (Bill Aberdeen), o tráfico foi definitivamente proibido, encerrando a importação de africanos escravizados."
        },
        {
            text: "A Lei do Ventre Livre (1871) libertava imediatamente todos os filhos de escravizadas nascidos a partir daquela data.",
            correct: false,
            justification: "Os filhos de escravizadas eram considerados livres, mas ficavam sob tutela dos senhores até os 21 anos, sendo raros os que realmente se libertavam."
        },
        {
            text: "As leis emancipacionistas (Ventre Livre e Sexagenários) foram criticadas pelos abolicionistas porque a idade para libertação (60 anos) era muito alta para a expectativa de vida dos cativos.",
            correct: true,
            justification: "A expectativa de vida dos escravizados era bem menor que 60 anos, tornando a Lei dos Sexagenários praticamente inócua."
        },
        {
            text: "A Lei Áurea (1888) extinguiu a escravidão no Brasil, libertou cerca de 700 mil pessoas e garantiu políticas de integração social, moradia e educação para os libertos.",
            correct: false,
            justification: "A lei aboliu a escravidão sem indenização aos escravistas, mas não criou políticas de integração. Os libertos ficaram sem moradia, emprego, terras ou educação."
        }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let userJustification = new Array(total).fill(null);

    // Elementos DOM
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const resultContent = document.getElementById('resultContent');
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Ajuste de fonte
    let currentFontSize = 16;
    function setFontSize(size) {
        document.querySelector('.quiz-wrapper').style.fontSize = size + 'px';
        const els = document.querySelectorAll('.question-text, .feedback, .opt-btn, .tool-btn, .restart-btn');
        els.forEach(el => el.style.fontSize = size + 'px');
        currentFontSize = size;
    }
    fontMinus.addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 2)));
    fontPlus.addEventListener('click', () => setFontSize(Math.min(36, currentFontSize + 2)));
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    });

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = `${currentIndex + 1}. ${q.text}`;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';

        const btns = optionsArea.querySelectorAll('.opt-btn');
        btns.forEach(btn => {
            btn.classList.remove('selected', 'correct-show', 'wrong-show');
        });

        const selected = userAnswers[currentIndex];
        if (selected !== null) {
            btns.forEach(btn => {
                const btnVal = btn.getAttribute('data-value') === 'true';
                if (btnVal === selected) {
                    btn.classList.add('selected');
                }
                // Mostra cor verde/vermelha se já respondeu
                if (btnVal === q.correct) {
                    btn.classList.add('correct-show');
                } else if (btnVal === selected && selected !== q.correct) {
                    btn.classList.add('wrong-show');
                }
            });
            if (userJustification[currentIndex]) {
                const isCorrect = (selected === q.correct);
                feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
                feedbackArea.classList.remove('hidden');
                feedbackArea.innerHTML = userJustification[currentIndex];
            }
        }

        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function selectAnswer(value) {
        if (userAnswers[currentIndex] !== null) return; // já respondeu
        const isTrue = (value === 'true');
        userAnswers[currentIndex] = isTrue;
        const q = questions[currentIndex];
        const isCorrect = (isTrue === q.correct);
        const correctText = q.correct ? "Verdadeiro" : "Falso";
        const explanation = `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>Justificativa: ${q.justification}<br><span style="font-size:0.9rem;">Resposta correta: ${correctText}.</span>`;
        userJustification[currentIndex] = explanation;
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = explanation;

        const btns = optionsArea.querySelectorAll('.opt-btn');
        btns.forEach(btn => {
            btn.classList.remove('selected', 'correct-show', 'wrong-show');
            const btnVal = btn.getAttribute('data-value') === 'true';
            if (btnVal === isTrue) btn.classList.add('selected');
            if (btnVal === q.correct) btn.classList.add('correct-show');
            else if (btnVal === isTrue && !isCorrect) btn.classList.add('wrong-show');
        });
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (btn) selectAnswer(btn.getAttribute('data-value'));
    });
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) { currentIndex++; renderQuestion(); }
        else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0;
        let erros = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].correct) acertos++;
            else if (userAnswers[i] !== null) erros++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina os processos de independência e o Brasil Império. Parabéns!";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Revise os tópicos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia os capítulos 9 e 10 do livro didático.";
        else mensagem = "📚 Que tal revisar os capítulos? Leia com calma e depois refaça o quiz.";

        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros} de ${total}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr style="margin: 15px 0;">
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    restartQuizBtn.addEventListener('click', () => {
        userAnswers = new Array(total).fill(null);
        userJustification = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    renderQuestion();
    setFontSize(16);
</script>
</body>
</html>
