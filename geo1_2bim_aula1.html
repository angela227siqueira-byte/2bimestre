<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🌱 Os Desafios da Sustentabilidade e a Agenda Ambiental</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }

        .reader-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .fixed-header {
            margin-bottom: 12px;
            border-bottom: 2px solid #dde5e0;
            padding-bottom: 8px;
        }
        .fixed-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a5e44;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #dee6e1;
            height: 7px;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #1a7a58;
            height: 7px;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s;
        }

        .text-content {
            text-align: justify;
            padding: 8px 0 16px;
            max-height: 58vh;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 2px;
            scroll-behavior: smooth;
        }
        .text-content p {
            margin-bottom: 1em;
        }
        .text-content h2, .text-content h3, .text-content h4 {
            margin: 1.2em 0 0.3em;
            color: #154e3a;
            font-weight: 600;
        }

        .img-text-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .img-container {
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        .img-container img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .img-caption {
            font-size: 0.85rem;
            color: #5a7a6a;
            margin-top: 8px;
            font-style: italic;
        }
        .text-container {
            flex: 2;
            min-width: 200px;
        }
        .right-image .text-container { order: 1; }
        .right-image .img-container { order: 2; }

        .toolbar-single {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 18px 0 14px;
            padding: 4px 0 8px;
            border-top: 1px solid #dde5e0;
            border-bottom: 1px solid #dde5e0;
        }
        .tool-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            color: #134531;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 10px 14px;
            border-radius: 48px;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tool-btn:active { background: #d0e0d7; transform: scale(0.96); }
        .tool-btn:disabled { opacity: 0.4; background: #e0e8e3; border-color: #b6ccc1; pointer-events: none; }

        .capa {
            text-align: center;
            padding: 40px 20px;
        }
        .capa h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #0f3d2e;
        }
        .capa h2 {
            font-size: 30px;
            margin-bottom: 40px;
            color: #1a5e44;
        }
        .capa p {
            font-size: 22px;
            color: #2a5e4a;
        }

        .congrats-page {
            text-align: center;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 50vh;
        }
        .congrats-page h2 {
            color: #1a5e44;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .congrats-page p:first-of-type {
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .congrats-page p:last-of-type {
            margin-top: 20px;
        }
        .congrats-image {
            text-align: center;
            margin: 20px auto;
        }
        .congrats-image img {
            transform: scale(1.3);
            max-width: 100%;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .reader-wrapper { max-width: 98%; padding: 15px; }
            .tool-btn { padding: 8px 10px; min-width: 50px; font-size: 0.9rem; }
            .img-text-row { flex-direction: column; }
            .right-image .text-container, .right-image .img-container {
                order: unset;
            }
            .capa h1 { font-size: 28px; }
            .capa h2 { font-size: 24px; }
            .capa p { font-size: 18px; }
            .congrats-image img {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
<div class="reader-wrapper">

        <div class="fixed-header">

    </div>
</div>

<script>

            `<div class="img-text-row right-image">
                <div class="text-container">
                    <p><strong>Setor Energético Brasileiro - A Fronteira em Debate</strong></p>
                    <p>Debate sobre a exploração na nova fronteira da Margem Equatorial.</p>
                    <p>Defensores: soberania energética, baixo histórico de acidentes em águas profundas.</p>
                    <p>Críticos: ameaça a corais, comunidades tradicionais e contradiz emergência climática.</p>
                </div>
                <div class="img-container">
                    <img src="https://marsemfim.com.br/wp-content/uploads/2025/03/mapa-da-Margem-Equatorial-.jpg" alt="Margem Equatorial">
                </div>
            </div>`,

            // Página 21 - Energias Alternativas - Origens
            `<div class="img-text-row right-image">
                <div class="text-container">
                    <p><strong>Energias Alternativas - Origens</strong></p>
                    <p>Crise do petróleo nos anos 1970 impulsionou a busca por alternativas.</p>
                    <p>Principal exemplo: Proálcool (biocombustível de cana-de-açúcar) no Brasil.</p>
                    <p>Expansão no Centro-Sul, mas com impactos de poluição por vinhoto e agrotóxicos.</p>
                </div>
                <div class="img-container">
                    <img src="https://i.ytimg.com/vi/Sr_kfowPuhc/maxresdefault.jpg" alt="Proálcool">
                </div>
            </div>`,

            // Página 22 - Energias Alternativas - Biodiesel e as Limpas
            `<div class="img-text-row right-image">
                <div class="text-container">
                    <p><strong>Energias Alternativas - Biodiesel e as Limpas</strong></p>
                    <p>Biodiesel é feito de plantas oleaginosas (soja, mamona, dendê).</p>
                    <p>Brasil adiciona biodiesel ao diesel mineral, incentivando sua produção.</p>
                    <p>Energias limpas (solar, eólica, maremotriz): não emitem carbono, mas são intermitentes.</p>
                </div>
                <div class="img-container">
                    <img src="https://clickpetroleoegas.com.br/wp-content/uploads/2026/03/biodiesel-mistura.jpg" alt="Biodiesel">
                </div>
            </div>`,

            // Página 23 - Energias Alternativas - Expansão e Conflitos
            `<div class="img-text-row right-image">
                <div class="text-container">
                    <p><strong>Energias Alternativas - Expansão e Conflitos</strong></p>
                    <p>Energia solar cresceu 79,8% e eólica 13% no Brasil entre 2021 e 2022.</p>
                    <p>Instalação de grandes parques gera conflitos no Nordeste.</p>
                    <p>Impactos: ocupação de terras, ruído das hélices, ameaça a comunidades tradicionais.</p>
                </div>
                <div class="img-container">
                    <img src="https://pousadamundodhalua.com.br/uploads/2026/04/16-336176652-comunidade-rural-luta-contra-projeto-de-parque-eolico-que-muda-a-paisagem-com-enormes-turbinas.jpg" alt="Parque eólico e comunidade">
                </div>
            </div>`,

            // Página 24 - Energias Alternativas - As Salvaguardas
            `<div class="img-text-row right-image">
                <div class="text-container">
                    <p><strong>Energias Alternativas - As Salvaguardas</strong></p>
                    <p>Comunidades propõem "Salvaguardas Ambientais para Energia Renovável".</p>
                    <p>Exigem licenciamento que respeite territórios e segurança alimentar.</p>
                    <p>Sugerem uso de cartografia social como ferramenta de planejamento dos parques.</p>
                </div>
                <div class="img-container">
                    <img src="https://cienciahoje.org.br/wp-content/uploads/2023/04/Demarcacao_sema.jpg" alt="Cartografia social">
                </div>
            </div>`,

            // Página 25 - Congratulações
            `<div class="congrats-page">
                <h2>🎉 Parabéns!</h2>
                <p style="margin-top: 20px;">Você concluiu a leitura sobre os Desafios da Sustentabilidade e a Agenda Ambiental.</p>
                <div class="congrats-image">
                    <img src="https://media.tenor.com/1Gq9HnEJ5wMAAAAM/shih-tzu-shihtzu.gif" alt="Parabéns">
                </div>
                <p style="margin-top: 20px;">Isso é Tudo por Hoje!</p>
            </div>`
        ];

        const totalPages = pageContents.length;
        let currentPage = 0;
        let fontSizeIndex = 3; // Começa em 15px (índice 3 do array)
        const fontSizes = [12, 13, 14, 15, 16, 18, 20, 24, 28, 32, 38, 42];

        // Elementos DOM
        const readerScr = document.getElementById('readerScreen');
        const pageContent = document.getElementById('pageContent');
        const pageXofY = document.getElementById('pageXofY');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const fontMinus = document.getElementById('fontMinusBtn');
        const fontPlus = document.getElementById('fontPlusBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const prevBtn = document.getElementById('prevBtnInline');
        const nextBtn = document.getElementById('nextBtnInline');
        const speakBtn = document.getElementById('speakBtn');
        const rateSelect = document.getElementById('rateSelect');

        let synth = window.speechSynthesis;
        let currentUtterance = null;
        let isSpeaking = false;

        function getFemaleVoice() {
            const voices = synth.getVoices();
            const ptVoices = voices.filter(v => v.lang === 'pt-BR');
            const female = ptVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('mulher') || v.name.includes('Samantha') || v.name.includes('Maria'));
            return female || ptVoices[0] || voices[0];
        }

        function updateUI() {
            pageContent.innerHTML = pageContents[currentPage];
            const num = currentPage + 1;
            pageXofY.textContent = `Página ${num} de ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);
            stopReading();
            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length-1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        function startReading() {
            if (!synth) {
                alert('Seu navegador não suporta síntese de voz.');
                return;
            }
            if (isSpeaking) {
                stopReading();
                return;
            }
            const text = pageContent.innerText;
            if (!text.trim()) return;
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);
            currentUtterance.onend = function() {
                isSpeaking = false;
                currentUtterance = null;
                speakBtn.textContent = '🔊';
            };
            synth.speak(currentUtterance);
            isSpeaking = true;
            speakBtn.textContent = '⏹️';
        }

        function stopReading() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            speakBtn.textContent = '🔊';
        }

        // Event listeners
        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length-1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));
        speakBtn.addEventListener('click', startReading);
        rateSelect.addEventListener('change', () => {
            if (isSpeaking && currentUtterance) {
                currentUtterance.rate = parseFloat(rateSelect.value);
            }
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
