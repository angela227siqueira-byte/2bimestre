<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa do Brasil Interativo</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* (coloque o CSS que eu já te dei antes aqui - vou resumir para não alongar) */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; padding: 20px; background: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #container { display: flex; flex-direction: row; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); overflow: hidden; max-width: 1200px; width: 100%; }
        #mapa-container { flex: 1; padding: 20px; background: #f8f9fa; min-height: 650px; display: flex; justify-content: center; align-items: center; position: relative; }
        #mapa-container svg { background: #d4e9ff; border-radius: 8px; border: 1px solid #ccc; width: 100%; height: auto; }
        #painel-direito { width: 350px; padding: 25px; background: #fff; border-left: 2px solid #dee2e6; }
        #painel-direito h2 { margin: 0; color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 8px; }
        .estado-destaque { fill-opacity: 0.85 !important; stroke: #000 !important; stroke-width: 2px !important; }
        .estado-padrao { stroke: #fff; stroke-width: 0.7px; }
        #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        /* Dados do painel... mantenha o resto do CSS que você já tem */
    </style>
</head>
<body>
<div id="container">
    <div id="mapa-container">
        <div id="mapa-brasil" style="position:relative; width:100%;">
            <div id="loading">⏳ Carregando mapa...</div>
        </div>
    </div>
    <div id="painel-direito">
        <h2>📍 Detalhes</h2>
        <div id="mini-mapa-container"><span class="placeholder">Passe o mouse sobre um estado</span></div>
        <div id="dados-estado"><div class="placeholder">Selecione um estado</div></div>
    </div>
</div>

<script>
    // --- Dados dos estados (mantenha o mesmo objeto dadosEstados que eu te passei) ---
    const dadosEstados = { ... }; // (copie o objeto enorme que já temos)

    // --- Configuração do mapa ---
    const width = 850, height = 700;
    const svgMapa = d3.select("#mapa-brasil")
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("width", "100%").style("height", "auto");
    d3.select("#loading").remove();

    // --- AQUI ESTÁ A MUDANÇA MÁGICA ---
    // Em vez de uma URL externa, use o caminho relativo ao seu arquivo HTML
    fetch('estados.json')  
        .then(res => {
            if (!res.ok) throw new Error("Erro ao ler arquivo local");
            return res.json();
        })
        .then(data => {
            const projection = d3.geoAlbers().fitSize([width, height], data);
            const path = d3.geoPath().projection(projection);
            const colorScale = d3.scaleOrdinal(d3.schemeSet2)
                .domain(data.features.map(d => d.properties.nome));

            const states = svgMapa.selectAll("path")
                .data(data.features).enter().append("path")
                .attr("d", path).attr("class", "estado-padrao")
                .style("fill", d => colorScale(d.properties.nome))
                .style("stroke", "#fff").style("stroke-width", "0.7px")
                .style("cursor", "pointer");

            states.on("mouseover", function(event, d) {
                const nomeEstado = d.properties.nome;
                d3.select(this).raise().classed("estado-padrao", false).classed("estado-destaque", true);
                atualizarPainel(nomeEstado, d);
            });
            states.on("mouseout", function() {
                d3.select(this).classed("estado-destaque", false).classed("estado-padrao", true);
                d3.select("#mini-mapa-container").html(`<span class="placeholder">Passe o mouse sobre um estado</span>`);
                d3.select("#dados-estado").html(`<div class="placeholder">Selecione um estado</div>`);
            });
        })
        .catch(err => {
            console.error(err);
            // Se falhar, exibe mensagem clara
            d3.select("#mapa-brasil").append("div")
                .style("color", "red").style("padding", "20px").style("font-weight", "bold")
                .text("❌ Erro: o arquivo 'estados.json' não foi encontrado na mesma pasta do HTML. Verifique se ele foi enviado ao GitHub.");
        });

    // --- Função de atualizar painel (igual a anterior) ---
    function atualizarPainel(nome, feature) { /* mantenha sua função */ }
</script>
</body>
</html>
