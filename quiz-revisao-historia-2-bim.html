<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · História · Capítulos 9 e 10 (Independências e Brasil Império)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 12px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
        }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .opt-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .opt-btn:hover { background: #dce8e0; }
        .opt-btn .letter-badge {
            background: #1a5e44;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .opt-btn.selected { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.selected .letter-badge { background: white; color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.correct-show .letter-badge { background: white; color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .opt-btn.wrong-show .letter-badge { background: white; color: #dc3545; }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; margin: 20px 0 10px; }
        .tool-btn {
            background: #ecf3ef; border: 1px solid #b3cdbf; padding: 12px; font-size: 1rem;
            border-radius: 48px; flex: 1; text-align: center; cursor: pointer;
        }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { font-size: 0.85rem; margin-bottom: 8px; color: #1a5e44; text-align: right; }
        .font-controls { display: flex; gap: 8px; margin-bottom: 15px; justify-content: flex-end; }
        .font-btn {
            background: #e6f0ea; border: none; padding: 6px 12px; border-radius: 40px; cursor: pointer; font-weight: bold;
        }
        .result-screen { text-align: center; }
        .result-box { background: #f0f7f3; padding: 20px; border-radius: 28px; margin: 20px 0; }
        .restart-btn {
            background: #1a5e44; color: white; border: none; padding: 14px; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 10px;
        }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        .hidden { display: none; }
        @media (max-width: 640px) { .quiz-wrapper { max-width: 100%; padding: 15px; } .opt-btn { padding: 10px 16px; } }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen active">
        <div class="font-controls">
            <button class="font-btn" id="fontMinus">A−</button>
            <button class="font-btn" id="fontPlus">A+</button>
            <button class="font-btn" id="fullscreenBtn">⛶ Tela cheia</button>
        </div>
        <div class="title">📜 História das Américas e Brasil Império</div>
        <div class="sub">Capítulos 9 e 10 – 20 questões de múltipla escolha</div>
        <div class="progress" id="progressText">Questão 1 de 20</div>
        <div id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsArea"></div>
            <div class="feedback hidden" id="feedbackArea"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    // =================== 20 QUESTÕES (Capítulos 9 e 10) ===================
    const questions = [
        {
            question: "1. (Capítulo 9 - página 201) Sobre as Reformas Bourbônicas, implementadas na segunda metade do século XVIII pela Coroa espanhola, é correto afirmar que:",
            options: [
                "A) A expulsão da ordem dos jesuítas dos territórios espanhóis visava aumentar o controle da Coroa sobre a administração e a riqueza colonial.",
                "B) O principal objetivo era conceder autonomia política total às colônias americanas.",
                "C) A abolição dos monopólios comerciais foi uma medida que enfraqueceu os lucros da elite criolla.",
                "D) As medidas não impactaram a arrecadação de impostos e o controle administrativo."
            ],
            correctIndex: 0,
            justification: "A página 201 explica que as Reformas Bourbônicas incluíram a expulsão dos jesuítas e a criação de novas intendências para aumentar o controle da administração colonial e a arrecadação de impostos."
        },
        {
            question: "2. (Capítulo 9 - página 202) A \"Lei do Selo\" de 1765, que exigia a compra de selos para todos os materiais impressos nas Treze Colônias, foi revogada devido:",
            options: [
                "A) Ao desejo da Grã-Bretanha de fortalecer a economia colonial.",
                "B) À forte pressão e aos boicotes organizados pelos colonos, que a consideravam uma afronta aos seus direitos.",
                "C) Ao sucesso militar da França contra os britânicos na América do Norte.",
                "D) Ao reconhecimento da independência dos Estados Unidos pela Grã-Bretanha."
            ],
            correctIndex: 1,
            justification: "A página 202 menciona que os colonos protestaram, formaram o Congresso contra a Lei do Selo, boicotaram produtos britânicos e depredaram pontos de venda, o que levou a metrópole a revogar a lei."
        },
        {
            question: "3. (Capítulo 9 - página 207) A Revolução Haitiana (1791-1804) é um marco na história das Américas porque:",
            options: [
                "A) Foi o único movimento de independência liderado exclusivamente pela elite criolla.",
                "B) A independência foi reconhecida pela França imediatamente, sem a exigência de indenização.",
                "C) Foi a única revolta bem-sucedida de escravizados e ex-escravizados na história da América que resultou na independência de uma nação.",
                "D) Resultou na criação de uma monarquia hereditária no Caribe."
            ],
            correctIndex: 2,
            justification: "A página 207 afirma que \"Esse foi o único caso na história da América em que escravizados e ex-escravizados lideraram a libertação da dominação colonial\"."
        },
        {
            question: "4. (Capítulo 9 - página 210) O \"Grito de Dolores\" (1810), liderado pelo padre Miguel Hidalgo, deu início ao processo de independência em qual região da América espanhola?",
            options: [
                "A) No Vice-Reino do Rio da Prata.",
                "B) No Vice-Reino da Nova Espanha (atual México).",
                "C) Na Capitania-Geral da Venezuela.",
                "D) No Vice-Reino do Peru."
            ],
            correctIndex: 1,
            justification: "A página 210 descreve que o movimento liderado por Miguel Hidalgo ocorreu na Intendência de Guanajuato, localizada no Vice-Reino da Nova Espanha."
        },
        {
            question: "5. (Capítulo 9 - página 209) Em 1812, as Cortes de Cádiz, reunidas na Espanha durante a invasão napoleônica, promulgaram a primeira constituição espanhola. Qual era um de seus princípios fundamentais?",
            options: [
                "A) O poder absoluto do rei, baseado na origem divina.",
                "B) A manutenção dos privilégios do clero e da nobreza sem restrições.",
                "C) A soberania da nação, o sufrágio masculino e a liberdade de imprensa.",
                "D) A abolição imediata da escravidão em todas as colônias espanholas."
            ],
            correctIndex: 2,
            justification: "A página 209 afirma que, de acordo com a Constituição de Cádiz, \"o poder emanava da nação espanhola, e não do rei\", e foram reconhecidas \"prerrogativas liberais, como a liberdade de imprensa, a separação dos poderes e o sufrágio masculino\"."
        },
        {
            question: "6. (Capítulo 9 - página 207) O termo \"haitianismo\" foi utilizado na época para designar:",
            options: [
                "A) A celebração da independência do Haiti por todas as nações americanas.",
                "B) O medo que as elites escravistas americanas tinham de que as revoltas de cativos se espalhassem, como havia ocorrido em São Domingos.",
                "C) A defesa da permanência da escravidão sob o argumento de que ela era necessária para o progresso.",
                "D) O incentivo governamental para a imigração de haitianos para outros países."
            ],
            correctIndex: 1,
            justification: "A página 207 explica que \"Por muito tempo, a independência do Haiti foi vista como exemplo ou como ameaça por alguns grupos sociais. Esse medo foi denominado haitianismo.\""
        },
        {
            question: "7. (Capítulo 9 - página 213) Após a Guerra da Cisplatina (1825-1828), que desfecho teve a região da Banda Oriental?",
            options: [
                "A) A região foi anexada permanentemente ao Império Brasileiro como Província Cisplatina.",
                "B) A região foi anexada às Províncias Unidas do Rio da Prata (Argentina).",
                "C) A região foi dividida entre Brasil e Argentina.",
                "D) A região alcançou a independência, constituindo a República Oriental do Uruguai."
            ],
            correctIndex: 3,
            justification: "A página 213 afirma que \"ao final da guerra, a Banda Oriental alcançou a independência, constituindo a República Oriental do Uruguai\"."
        },
        {
            question: "8. (Capítulo 9 - página 210) O movimento de independência liderado pelo padre Miguel Hidalgo no México, que começou com o \"Grito de Dolores\", foi caracterizado por:",
            options: [
                "A) Ser um movimento exclusivamente da elite criolla, sem participação popular.",
                "B) Reunir uma grande massa de indígenas, mestiços e trabalhadores pobres, o que assustou a elite criolla.",
                "C) Alcançar a independência total do México no mesmo ano de 1810.",
                "D) Contar com o apoio imediato e incondicional da Espanha."
            ],
            correctIndex: 1,
            justification: "A página 210 descreve que o movimento \"reuniu indígenas, mestiços e trabalhadores pobres\" e que sua \"variada composição social incomodou a elite criolla\"."
        },
        {
            question: "9. (Capítulo 9 - página 215) O texto destaca a participação feminina nas lutas pela independência da América espanhola, como a de Manuela Sáenz. Qual foi uma das formas de atuação dessas mulheres mencionadas?",
            options: [
                "A) Elas foram excluídas de qualquer participação política ou militar.",
                "B) Elas ocuparam cargos de liderança nos exércitos inimigos (realistas).",
                "C) Elas atuaram apenas como enfermeiras, cuidando dos feridos em hospitais de campanha.",
                "D) Elas atuaram como espiãs, mensageiras, financiadoras e, em alguns casos, comandaram batalhões."
            ],
            correctIndex: 3,
            justification: "A página 215 afirma que as mulheres \"participaram desses movimentos tanto nos exércitos quanto no apoio às tropas, atuando como informantes, mensageiras, articuladoras políticas e difusoras das ideias de independência\"."
        },
        {
            question: "10. (Capítulo 9 - página 216) O Congresso do Panamá (1826), convocado por Simón Bolívar, visava unir as novas nações americanas. Sobre este evento, o texto afirma que:",
            options: [
                "A) Não foi instituído, pois o Brasil e outras nações tinham interesses divergentes ou não participaram.",
                "B) Resultou na criação de uma monarquia pan-americana unificada.",
                "C) Foi um sucesso absoluto, criando uma confederação que durou todo o século XIX.",
                "D) Foi ignorado por todas as nações americanas."
            ],
            correctIndex: 0,
            justification: "A página 216 menciona que \"O Brasil, por exemplo, manteve a escravidão e o regime monárquico... e não participou do Congresso\", e que vários fatores impediram a instituição da confederação desejada."
        },
        {
            question: "11. (Capítulo 10 - página 218) A Constituição de 1824, outorgada por dom Pedro I, criou o \"Poder Moderador\". Este poder permitia ao imperador:",
            options: [
                "A) Atuar apenas como chefe do Poder Executivo, sem interferir nos demais.",
                "B) Ser o chefe exclusivo do Poder Judiciário.",
                "C) Dissolver a Câmara dos Deputados, vetar leis e nomear juízes e senadores.",
                "D) Nomear diretamente os membros da Câmara dos Deputados."
            ],
            correctIndex: 2,
            justification: "A página 218 explica que o Poder Moderador permitia ao imperador \"interferir nas atribuições dos demais poderes\", autorizando-o, por exemplo, a \"escolher os senadores, dissolver a Câmara dos Deputados, vetar as leis... nomear os juízes\"."
        },
        {
            question: "12. (Capítulo 10 - página 219) O que foi a \"Confederação do Equador\" (1824), liderada por figuras como Frei Caneca?",
            options: [
                "A) Um acordo comercial entre as províncias do Norte e o Equador.",
                "B) Um movimento que defendia a permanência do Poder Moderador e a centralização monárquica.",
                "C) Uma rebelião de escravizados no Maranhão que se espalhou pelo Nordeste.",
                "D) Um movimento republicano e federalista que contestava o autoritarismo do imperador e a centralização do poder."
            ],
            correctIndex: 3,
            justification: "A página 219 afirma que os liberais pernambucanos \"convidaram as províncias... a formarem um Estado federalista e republicano\", sendo este um movimento de contestação ao poder de dom Pedro I."
        },
        {
            question: "13. (Capítulo 10 - página 223-224) A Lei de Terras de 1850 foi um marco importante no Brasil imperial. Seu principal impacto foi:",
            options: [
                "A) Distribuir terras gratuitamente para todos os cidadãos, especialmente libertos e imigrantes.",
                "B) Dificultar o acesso à terra para pequenos agricultores, posseiros e libertos, garantindo mão de obra para os cafeicultores.",
                "C) Declarar todas as terras como devolutas e doá-las à Igreja Católica.",
                "D) Proibir a venda de terras para estrangeiros, mantendo-as exclusivamente para brasileiros."
            ],
            correctIndex: 1,
            justification: "A página 223-224 explica que a lei permitia a regularização de terras mediante pagamento de taxas, cujo alto custo \"acabou levando à expulsão dos pequenos posseiros\" e \"dificultou a possibilidade de que libertos, imigrantes... obtivessem a propriedade\"."
        },
        {
            question: "14. (Capítulo 10 - página 221) A Revolta dos Malês (1835), ocorrida em Salvador, foi um levante de:",
            options: [
                "A) Escravizados e libertos islamizados (malês) que contestavam a escravidão.",
                "B) Indígenas contra a catequização forçada e o confinamento em aldeamentos.",
                "C) Grandes proprietários do Recôncavo Baiano contra os altos impostos imperiais.",
                "D) Liberais exaltados que defendiam a autonomia das províncias e o fim da monarquia."
            ],
            correctIndex: 0,
            justification: "A página 221 afirma que \"A palavra malê era utilizada para designar os africanos... que seguiam a fé islâmica\" e que \"o islamismo uniu escravizados e libertos na contestação da escravidão\"."
        },
        {
            question: "15. (Capítulo 10 - página 223) Durante o Segundo Reinado, o Partido Liberal e o Partido Conservador apresentavam algumas diferenças, mas também semelhanças. Uma característica comum a ambos era:",
            options: [
                "A) A defesa da abolição imediata da escravidão.",
                "B) A defesa da descentralização total do poder para as províncias.",
                "C) A defesa de um sistema republicano e federalista.",
                "D) A origem social, a formação educacional e os métodos para obter votos, como violência e distribuição de favores."
            ],
            correctIndex: 3,
            justification: "A página 223 explica que \"Liberais e conservadores partilhavam a origem social, a formação educacional e os métodos para obter votos: violência contra os opositores e distribuição de favores aos apadrinhados\"."
        },
        {
            question: "16. (Capítulo 10 - página 224) O processo de construção da identidade nacional no Brasil Império, incentivado pelo Instituto Histórico e Geográfico Brasileiro (IHGB), baseou-se em:",
            options: [
                "A) Uma crítica profunda à escravidão e à realidade social do país.",
                "B) Uma exaltação da cultura africana e do movimento abolicionista.",
                "C) Uma idealização do indígena e um apagamento da importância dos povos africanos e da escravidão no discurso oficial.",
                "D) Uma defesa incondicional da república e da descentralização do poder."
            ],
            correctIndex: 2,
            justification: "A página 224 afirma que \"a importância dos povos africanos e de suas culturas foi apagada do discurso oficial\" e que \"o indígena idealizado... era enaltecido\" enquanto os reais eram perseguidos."
        },
        {
            question: "17. (Capítulo 10 - página 226) A Lei Eusébio de Queirós (1850) foi um marco na luta contra o tráfico de escravizados. Ela determinava:",
            options: [
                "A) A proibição do tráfico transatlântico de africanos escravizados.",
                "B) A abolição imediata da escravidão em todo o território brasileiro.",
                "C) A libertação de todos os escravizados com mais de 60 anos.",
                "D) O incentivo à imigração de trabalhadores europeus para substituir a mão de obra escrava."
            ],
            correctIndex: 0,
            justification: "A página 226 explica que, diante do contexto de agitação e pressão britânica, \"o tráfico de africanos no Império Brasileiro foi proibido por meio da Lei Eusébio de Queirós, aprovada em 1850\"."
        },
        {
            question: "18. (Capítulo 10 - página 228) As leis emancipacionistas do final do Império, como a Lei do Ventre Livre (1871) e a Lei dos Sexagenários (1885), foram criticadas pelos abolicionistas porque:",
            options: [
                "A) Eram leis radicais que libertavam todos os escravizados imediatamente, causando caos econômico.",
                "B) Proibiam a imigração europeia, o que prejudicava a economia.",
                "C) Exigiam indenizações muito altas dos escravistas, inviabilizando o processo.",
                "D) A idade para libertação (60 anos) era muito alta para a baixa expectativa de vida dos cativos, e os filhos de escravizados ficavam sob controle dos proprietários por muitos anos."
            ],
            correctIndex: 3,
            justification: "A página 228 afirma que \"a expectativa de vida dos escravizados era bem mais baixa que a idade estabelecida para a libertação\" (Lei dos Sexagenários) e que, pela Lei do Ventre Livre, as crianças ficariam sob responsabilidade do proprietário, muitas vezes até os 21 anos."
        },
        {
            question: "19. (Capítulo 10 - página 228) A Lei Áurea (1888) extinguiu a escravidão no Brasil, mas não atendeu a todas as reivindicações do movimento abolicionista. Isso significa que:",
            options: [
                "A) O governo concedeu indenizações aos escravistas e distribuiu terras aos libertos.",
                "B) Foram criadas imediatamente políticas de ação afirmativa para a população negra.",
                "C) Aproximadamente 700 mil pessoas foram libertadas, mas sem garantias de moradia, emprego, terras ou educação, e o racismo estrutural permaneceu.",
                "D) A monarquia foi fortalecida e continuou a governar por mais 50 anos."
            ],
            correctIndex: 2,
            justification: "A página 228 afirma que a Lei Áurea \"extinguindo a escravidão no Brasil... cerca de 700 mil pessoas eram escravizadas no país\" e que \"não regulamentou nenhuma das reivindicações do movimento abolicionista sobre as formas de vida das pessoas libertas, tampouco concedeu indenizações\"."
        },
        {
            question: "20. (Capítulo 10 - página 217) A consolidação da independência do Brasil não foi um processo pacífico. Na Bahia, por exemplo, a independência é celebrada em 7 de setembro, mas também em 2 de julho. Isso se deve ao fato de que:",
            options: [
                "A) Nessa data ocorreu a derrota final das tropas portuguesas em Salvador e Itaparica, marcando o fim da Guerra de Independência na Bahia.",
                "B) Foi nessa data que a princesa Isabel assinou a Lei Áurea.",
                "C) Foi o dia da coroação de dom Pedro I como imperador do Brasil.",
                "D) Foi a data da Proclamação da República, que consolidou a independência do país."
            ],
            correctIndex: 0,
            justification: "A página 217 explica que a independência do Brasil é celebrada em 2 de julho na Bahia porque \"somente nessa data ocorreu a derrota final das tropas portuguesas em Salvador, Itaparica e outras localidades\"."
        }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);

    // Elementos DOM
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const resultContent = document.getElementById('resultContent');
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Ajuste de fonte
    let currentFontSize = 16;
    function setFontSize(size) {
        document.querySelector('.quiz-wrapper').style.fontSize = size + 'px';
        currentFontSize = size;
    }
    fontMinus.addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 2)));
    fontPlus.addEventListener('click', () => setFontSize(Math.min(36, currentFontSize + 2)));
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    });

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = q.question;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';

        optionsArea.innerHTML = '';
        q.options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.setAttribute('data-index', idx);
            btn.innerHTML = `<span class="letter-badge">${String.fromCharCode(65 + idx)}</span>${optText.replace(/^[A-D]\)\s*/, '')}`;
            optionsArea.appendChild(btn);
        });

        const selectedIdx = userAnswers[currentIndex];
        if (selectedIdx !== null) {
            highlightSelected(selectedIdx);
            showFeedback(selectedIdx);
        }

        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function highlightSelected(idx) {
        const btns = optionsArea.querySelectorAll('.opt-btn');
        btns.forEach(btn => {
            btn.classList.remove('selected', 'correct-show', 'wrong-show');
            if (parseInt(btn.getAttribute('data-index')) === idx) {
                btn.classList.add('selected');
            }
        });
    }

    function showFeedback(selectedIdx) {
        const q = questions[currentIndex];
        const isCorrect = (selectedIdx === q.correctIndex);
        const btns = optionsArea.querySelectorAll('.opt-btn');

        btns.forEach(btn => {
            btn.classList.remove('correct-show', 'wrong-show', 'selected');
            const idx = parseInt(btn.getAttribute('data-index'));
            if (idx === q.correctIndex) {
                btn.classList.add('correct-show');
            } else if (idx === selectedIdx && !isCorrect) {
                btn.classList.add('wrong-show');
            }
        });

        const correctLetter = String.fromCharCode(65 + q.correctIndex);
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = `
            <strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>
            ${q.justification}<br>
            <span style="font-size:0.9rem;">Resposta correta: <strong>${correctLetter}</strong>.</span>
        `;
    }

    function selectAnswer(index) {
        if (userAnswers[currentIndex] !== null) return;
        userAnswers[currentIndex] = index;
        highlightSelected(index);
        showFeedback(index);
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (btn && userAnswers[currentIndex] === null) {
            const idx = parseInt(btn.getAttribute('data-index'));
            selectAnswer(idx);
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });
    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) { currentIndex++; renderQuestion(); }
        else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0;
        let erros = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] === questions[i].correctIndex) acertos++;
            else if (userAnswers[i] !== null) erros++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina o conteúdo dos capítulos 9 e 10. Parabéns!";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Estude os tópicos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia as seções sobre os temas que teve mais dificuldade.";
        else mensagem = "📚 Que tal revisar os capítulos? Leia com calma e depois refaça o quiz.";

        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros} de ${total}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr style="margin: 15px 0;">
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    restartQuizBtn.addEventListener('click', () => {
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    renderQuestion();
    setFontSize(16);
</script>
</body>
</html>
