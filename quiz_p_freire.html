<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Paulo Freire · Obra e Pensamento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 12px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .opt-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
        }
        .opt-btn.selected {
            background: #1a5e44;
            color: white;
            border-color: #1a5e44;
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback.correct {
            background: #d4edda;
            border-left: 6px solid #28a745;
        }
        .feedback.wrong {
            background: #f8d7da;
            border-left: 6px solid #dc3545;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0 10px;
        }
        .tool-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 12px;
            font-size: 1rem;
            border-radius: 48px;
            flex: 1;
            text-align: center;
            cursor: pointer;
        }
        .progress {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #1a5e44;
            text-align: right;
        }
        .font-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: flex-end;
        }
        .font-btn {
            background: #e6f0ea;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .result-screen {
            text-align: center;
        }
        .result-layout {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .result-box {
            background: #f0f7f3;
            padding: 20px;
            border-radius: 28px;
            margin: 20px 0;
            flex: 1;
            min-width: 280px;
        }
        .result-image {
            flex: 0 0 auto;
            max-width: 250px;
        }
        .result-image img {
            width: 100%;
            border-radius: 20px;
        }
        .restart-btn {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .stats {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        .start-screen-layout {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .start-text {
            flex: 1;
            min-width: 250px;
        }
        .start-image {
            flex: 0 0 auto;
            max-width: 200px;
        }
        .start-image img {
            width: 100%;
            border-radius: 20px;
        }
        .init-btn {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.3rem;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        @media (max-width: 640px) {
            .quiz-wrapper {
                max-width: 100%;
                padding: 15px;
            }
            .opt-btn {
                padding: 8px 16px;
            }
            .start-screen-layout {
                flex-direction: column;
                text-align: center;
            }
            .result-layout {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
<div class="quiz-wrapper">

    <!-- TELA INICIAL (CAPA) -->
    <div id="startScreen" class="screen active">
        <div class="font-controls">
            <button class="font-btn" id="fontMinusStart">A−</button>
            <button class="font-btn" id="fontPlusStart">A+</button>
            <button class="font-btn" id="fullscreenBtnStart">⛶ Tela cheia</button>
        </div>
        <div class="start-screen-layout">
            <div class="start-text">
                <div class="title">📚 Quiz · Paulo Freire</div>
                <div class="sub">Obra e Pensamento — 15 questões</div>
                <p style="text-align: center; color: #1a2e2a; margin-top: 10px;">
                    Teste seus conhecimentos sobre a vida, a obra e o legado de Paulo Freire, patrono da educação brasileira.
                </p>
            </div>
            <div class="start-image">
                <img src="https://userscontent2.emaze.com/images/726e98ab-6603-4bb4-9fcc-77d816de4728/ce26e422-af21-4f70-8266-e97337eb33f4.gif" alt="Paulo Freire" onerror="this.style.display='none'">
            </div>
        </div>
        <button class="init-btn" id="startQuizBtn">▶ Iniciar Quiz</button>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen">
        <div class="font-controls">
            <button class="font-btn" id="fontMinus">A−</button>
            <button class="font-btn" id="fontPlus">A+</button>
            <button class="font-btn" id="fullscreenBtn">⛶ Tela cheia</button>
        </div>
        <div class="title">📚 Quiz · Paulo Freire</div>
        <div class="sub">Obra e Pensamento — 15 questões</div>
        <div class="progress" id="progressText">Questão 1 de 15</div>
        <div id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsArea"></div>
            <div class="feedback" id="feedbackArea" style="display: none;"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Resultado Final</h2>
        <div class="result-layout">
            <div class="result-box" id="resultContent"></div>
            <div class="result-image">
                <img src="https://media.tenor.com/1Gq9HnEJ5wMAAAAM/shih-tzu-shihtzu.gif" alt="Parabéns" onerror="this.style.display='none'">
            </div>
        </div>
        <p style="margin-top: 10px; font-size: 1.2rem; font-weight: bold; color: #0f3d2e;" id="congratsMsg"></p>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    // ========== 15 QUESTÕES - PAULO FREIRE ==========
    // type: "vf" = Verdadeiro/Falso, "mc" = Múltipla escolha
    const questions = [{
        id: 1,
        type: "mc",
        text: "Leia o excerto: \"Uma verdadeira filosofia da educação não poderá fundar-se apenas em ideias. Tem de identificar-se com o contexto a que vai se aplicar o seu agir educativo. Tem de ter consciência crítica do contexto – dos seus valores em transição –, somente como pode interferir neste contexto, para que dele também não seja uma escrava.\" (FREIRE, Paulo. Educação e atualidade brasileira. São Paulo: Cortez Editora, 2001). Neste trecho, Paulo Freire se refere à relação entre:",
        options: [
            "A) educação e sociedade.",
            "B) conteúdo e metodologia.",
            "C) método e epistemologia.",
            "D) educação e subjetividade."
        ],
        correct: 0,
        justification: "Freire defende que a educação deve estar vinculada ao contexto social, sendo a relação educação-sociedade o eixo central de sua filosofia. A educação não pode ser neutra nem descolada da realidade."
    }, {
        id: 2,
        type: "mc",
        text: "Freire (1996, p. 102) frisa que \"ensinar é uma especificidade humana\" e, para isso, esse ato tem seus saberes indispensáveis para a prática docente. Sobre esses saberes, conforme as ideias do autor, pode-se afirmar que:",
        options: [
            "A) a segurança para se exercer a autoridade docente independe da sua competência profissional.",
            "B) a reinvenção do ser humano no processo de aprendizagem de sua autonomia é fundamental nas relações entre educador e educando, entre autoridade e liberdades.",
            "C) a educação é considerada neutra, indiferente à reprodução da ideologia dominante ou ao seu desmascaramento.",
            "D) o saber escutar exige de quem realmente escuta sua redução ao outro que fala."
        ],
        correct: 1,
        justification: "Para Freire, a autonomia do educando é construída na relação dialógica entre educador e educando, em que autoridade e liberdade se equilibram. A segurança docente está ligada à competência profissional, a educação nunca é neutra, e escutar não significa anular-se."
    }, {
        id: 3,
        type: "vf",
        text: "A respeito da relação professor/aluno abordada em \"Pedagogia da Autonomia\": Para que se desenvolva a leitura, a escrita, a reflexão, a aprendizagem e a pesquisa autônoma, são importantes as relações de afetividade, confiança, empatia e respeito entre professores e alunos. Assim, os educadores devem permitir que tais sentimentos interfiram no cumprimento ético de seu dever de professor.",
        correct: false,
        justification: "Freire valoriza a afetividade, mas ela não deve interferir no cumprimento ético do dever docente. O educador deve manter seu compromisso ético, não permitindo que sentimentos comprometam seu papel formador. (Gabarito: Errado)"
    }, {
        id: 4,
        type: "vf",
        text: "A partir da elaboração, por Paulo Freire, do relatório \"A Educação de Adultos e as Populações Marginais: o Problema dos Mocambos\", introduziu-se, no país, uma nova maneira de abordar a alfabetização de adultos.",
        correct: true,
        justification: "Esse relatório, elaborado por Freire nos anos 1960, foi um marco na forma de conceber a alfabetização de adultos no Brasil, ao considerar o contexto sociocultural dos educandos. (Gabarito: Certo)"
    }, {
        id: 5,
        type: "vf",
        text: "Para a teoria freiriana, a função da escola é preparar criticamente o indivíduo, integrando-o à sociedade, contribuindo para a transformação social, por meio de uma prática criativa, participativa, dialógica e conscientizadora.",
        correct: true,
        justification: "A pedagogia freiriana tem como base a formação crítica e a transformação social, por meio do diálogo, da participação e da conscientização. (Gabarito: Certo)"
    }, {
        id: 6,
        type: "mc",
        text: "Conforme a teoria de Paulo Freire, é papel da escola formar a consciência política do aluno através da problematização da realidade, das relações sociais do homem com a natureza e outros homens, visando sua atuação e transformação social. A tendência pedagógica à luz da teoria de Freire é:",
        options: [
            "A) Progressista Libertária.",
            "B) Progressista Histórico-crítica.",
            "C) Progressista Libertadora.",
            "D) Liberal Tecnicista.",
            "E) Liberal Escola Nova."
        ],
        correct: 2,
        justification: "A pedagogia de Freire é classificada como Progressista Libertadora, por seu caráter emancipatório, dialógico e voltado à transformação social. A Progressista Libertária tem outras raízes, e a Histórico-crítica é associada a Dermeval Saviani."
    }, {
        id: 7,
        type: "mc",
        text: "Toda proposta pedagógica traz em seu bojo pressuposições e proposições filosóficas. A Pedagogia da Libertação tem como pressuposto a ideia de libertação completa do homem. Assinale a alternativa que corresponde ao pensador dessa proposta.",
        options: [
            "A) Anísio Teixeira.",
            "B) Lourenço Filho.",
            "C) Paulo Freire.",
            "D) Dermeval Saviani.",
            "E) Pierre Bourdieu."
        ],
        correct: 2,
        justification: "A Pedagogia da Libertação (ou Libertadora) é a proposta de Paulo Freire, centrada na conscientização e na superação da opressão. Anísio Teixeira é ligado ao movimento da Escola Nova, Saviani à Pedagogia Histórico-crítica, e Bourdieu à sociologia da educação."
    }, {
        id: 8,
        type: "mc",
        text: "Para a superação da educação bancária, Paulo Freire (2005) preconizou um processo de ensino e aprendizagem pautado na superação da relação opressor-oprimido, configurando uma visão ampla da educação. Assinale a alternativa que se relaciona a essa forma de conceber a educação.",
        options: [
            "A) A aprendizagem consiste em adquirir informações e demonstrações transmitidas.",
            "B) A educação é um produto baseado em modelos pré-estabelecidos, estruturado na transmissão de ideias selecionadas e organizadas logicamente.",
            "C) O processo de educação deverá assegurar a transmissão de conhecimentos, comportamentos éticos, práticas sociais e habilidades consideradas básicas para a manipulação e controle do ambiente.",
            "D) A verdadeira educação consiste numa ação problematizadora, libertadora.",
            "E) O ensino corresponde ao arranjo ou à disposição de contingências para uma aprendizagem eficaz."
        ],
        correct: 3,
        justification: "Freire contrapõe a educação bancária (depósito de informações) à educação problematizadora e libertadora, que visa à conscientização e à transformação da realidade."
    }, {
        id: 9,
        type: "mc",
        text: "A obra de Paulo Freire \"Pedagogia da Autonomia\" está dividida em três capítulos. Assinale a alternativa que contemple de forma correta alguns dos pressupostos desta obra sobre o ato de ensinar:",
        options: [
            "A) A preocupação central da práxis pedagógica é a transmissão e assimilação de conteúdos para os sujeitos das classes populares.",
            "B) Ensinar exige criticidade e pesquisa, sendo preciso abandonar e negar o senso comum para construir, por meio da ciência, a visão crítica.",
            "C) O educador estabelece com o educando uma relação na qual o conhecimento advém daquele que já percorreu uma trajetória acadêmica.",
            "D) Ensinar inexiste sem aprender e vice-versa; não há ensino sem pesquisa e pesquisa sem ensino. Enquanto ensino, continuo buscando, indagando e me indagando.",
            "E) Cabe ao educador instigar a curiosidade crítica para que o educando seja capaz de superar a realidade imediata, sendo o professor o único detentor do saber."
        ],
        correct: 3,
        justification: "Esta é uma das teses centrais da Pedagogia da Autonomia: a indissociabilidade entre ensino, aprendizagem e pesquisa. Freire afirma que 'quem ensina aprende ao ensinar e quem aprende ensina ao aprender'."
    }, {
        id: 10,
        type: "mc",
        text: "Freire aponta que \"o clima do pensar certo não tem nada a ver com o das fórmulas pré-estabelecidas\". Assinale a alternativa que apresenta corretamente a relação entre \"pensar certo\" e \"método\" para Freire:",
        options: [
            "A) Não há pensar certo sem considerar o materialismo histórico-dialético.",
            "B) O método escolhido pelo sujeito determina seu pensar certo.",
            "C) Sem rigorosidade metodológica não há pensar certo.",
            "D) O pensar certo é possível a partir do método que lhe confere veracidade."
        ],
        correct: 2,
        justification: "Para Freire, o 'pensar certo' exige rigorosidade metódica, ou seja, disciplina intelectual e aproximação crítica do objeto de conhecimento, sem cair no espontaneísmo."
    }, {
        id: 11,
        type: "mc",
        text: "Paulo Freire, em \"Pedagogia da Autonomia\", elege como saber necessário à prática educativa compreender que a educação é uma forma de intervenção no mundo. Essa intervenção exige do professor:",
        options: [
            "A) compreender que é seu dever se posicionar de forma imparcial e neutra, priorizando o puro ensino dos conteúdos.",
            "B) perceber que toda prática pedagógica inevitavelmente só atua como reprodutora da ideologia dominante.",
            "C) considerar tão importante o ensino dos conteúdos quanto o seu testemunho ético ao ensiná-los.",
            "D) adotar uma postura de autoridade e segurança que deixe claro para o aluno a supremacia do saber docente."
        ],
        correct: 2,
        justification: "Freire defende que o professor não é neutro e que seu testemunho ético é tão importante quanto o conteúdo ensinado. A coerência entre discurso e prática é fundamental."
    }, {
        id: 12,
        type: "mc",
        text: "A temática autonomia ganha em Paulo Freire, em seu livro \"Pedagogia da Autonomia\", um sentido sócio-político-pedagógico, onde é vista como:",
        options: [
            "A) uma forma de afastar a transformação da sociedade, independentemente de sua legitimidade e adequabilidade a outros valores.",
            "B) algo além da liberdade de pensar por si, pois envolve a capacidade de agir, sendo o homem ativo contrário ao homem autônomo.",
            "C) condição sócio-histórica de um povo ou pessoa que tenha se libertado, se emancipado das opressões que restringem ou anulam sua liberdade de determinação.",
            "D) algo que deve ser conquistado, construído a partir das decisões, das vivências, da própria liberdade, sem preocupação com a emancipação humana.",
            "E) um atributo humano essencial, na medida em que está vinculada à ideia de dignidade e a de o ser humano ser espontaneamente autônomo."
        ],
        correct: 2,
        justification: "Para Freire, a autonomia é uma construção sócio-histórica, fruto da emancipação das opressões. Não é algo dado espontaneamente, mas conquistado no processo de libertação."
    }, {
        id: 13,
        type: "mc",
        text: "Na concepção de Educação Bancária de Paulo Freire, a relação professor-aluno é uma relação que se estabelece a partir da ideia de que os educandos são transformados em recipientes a serem cheios e na qual o educador:",
        options: [
            "A) se mantém em posições fixas e invariáveis, sendo sempre o que doa seu saber ao ignorante.",
            "B) se antagoniza com a figura daquele que tudo sabe e que salvará da ignorância os sujeitos oprimidos.",
            "C) desaliena o outro da ignorância e da opressão político-ideológica.",
            "D) oprime o educando de forma bancária, seletiva e excludente."
        ],
        correct: 0,
        justification: "Na educação bancária, o educador é o sujeito ativo que 'deposita' conhecimento nos educandos, vistos como recipientes vazios e ignorantes. A relação é fixa e hierárquica."
    }, {
        id: 14,
        type: "mc",
        text: "A pedagogia proposta por Paulo Freire acredita numa educação capaz de contribuir para a transformação das pessoas e da sociedade. Desse modo, os aspectos relacionados à pedagogia freiriana são os seguintes:",
        options: [
            "A) exposição verbal; conteúdos predefinidos; adequação à realidade; relações verticais; aprendizagem como acumulação de conhecimentos.",
            "B) exposição verbal; temas geradores; problematização da realidade; relação horizontal; aprendizagem informal e livre.",
            "C) diálogo como método; temas geradores; conteúdos socialmente relevantes; relações autogestionadas; aprendizagem informal.",
            "D) diálogo como método; temas geradores; problematização da realidade; relação horizontal; aprendizagem como construção coletiva.",
            "E) diálogo como método; conteúdos predefinidos; problematização da realidade; relações verticais; aprendizagem como construção coletiva."
        ],
        correct: 3,
        justification: "A pedagogia freiriana se baseia no diálogo, nos temas geradores extraídos da realidade, na problematização, na relação horizontal entre educador e educando, e na construção coletiva do conhecimento."
    }, {
        id: 15,
        type: "mc",
        text: "\"O educador deve respeito à autonomia, à dignidade e à identidade do educando e, na prática, procurar a coerência com este saber, o que leva à criação de algumas virtudes ou qualidades sem as quais esse saber vira palavreado vazio e inoperante.\" (Paulo Freire). Assinale a alternativa que melhor atende ao proposto por Freire:",
        options: [
            "A) O educador respeita a dignidade do aluno quando deixa de considerar o conhecimento que o aluno traz consigo.",
            "B) Ao educador cabe impor sua vontade ao aluno, para fazer com que o aluno compreenda o seu papel nessa relação.",
            "C) O educador deve falar em democracia e liberdade para ensinar ao aluno o seu sentido e entender a obediência que deve à vontade do professor.",
            "D) O educador com atuação engajada na formação de educandos procura conhecer as condições sociais, culturais e econômicas de seus alunos e de sua família.",
            "E) O educador que se preocupa com o processo de aprendizagem do seu aluno utiliza seu tempo para ensinar e não desvia sua atenção para o contexto social do aluno."
        ],
        correct: 3,
        justification: "Freire defende que o educador deve conhecer a realidade dos educandos para uma prática significativa. O respeito à autonomia e à dignidade passa por considerar o contexto social, cultural e econômico do aluno."
    }];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let userJustification = new Array(total).fill(null);

    // Elementos DOM
    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const resultContent = document.getElementById('resultContent');
    const congratsMsg = document.getElementById('congratsMsg');
    const startQuizBtn = document.getElementById('startQuizBtn');

    // Ajuste de fonte (acessibilidade)
    let currentFontSize = 16;

    function setFontSize(size) {
        document.querySelector('.quiz-wrapper').style.fontSize = size + 'px';
        const els = document.querySelectorAll('.question-text, .feedback, .opt-btn, .tool-btn, .restart-btn, .init-btn');
        els.forEach(el => el.style.fontSize = size + 'px');
        currentFontSize = size;
    }

    // Controles de fonte - Tela inicial
    document.getElementById('fontMinusStart').addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 2)));
    document.getElementById('fontPlusStart').addEventListener('click', () => setFontSize(Math.min(36, currentFontSize + 2)));
    document.getElementById('fullscreenBtnStart').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    // Controles de fonte - Tela do quiz
    document.getElementById('fontMinus').addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 2)));
    document.getElementById('fontPlus').addEventListener('click', () => setFontSize(Math.min(36, currentFontSize + 2)));
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    // Iniciar quiz
    startQuizBtn.addEventListener('click', () => {
        startScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    function renderQuestion() {
        const q = questions[currentIndex];
        let qText = `${currentIndex+1}. ${q.text}`;
        if (q.type === "vf") {
            qText += "\n\n(  ) Certo\n(  ) Errado";
        }
        questionText.innerText = qText;
        feedbackArea.style.display = 'none';
        feedbackArea.className = 'feedback';

        // Gerar botões de opções
        let optionsHTML = '';
        if (q.type === "vf") {
            optionsHTML = `
                <button class="opt-btn" data-value="true">✅ Certo</button>
                <button class="opt-btn" data-value="false">❌ Errado</button>
            `;
        } else {
            q.options.forEach((opt, idx) => {
                optionsHTML +=
                    `<button class="opt-btn" data-value="${idx}" data-letter="${String.fromCharCode(65+idx)}">${opt}</button>`;
            });
        }
        optionsArea.innerHTML = optionsHTML;

        // Restaurar seleção anterior
        const selected = userAnswers[currentIndex];
        if (selected !== null) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                let match = false;
                if (q.type === "vf") {
                    match = (btn.getAttribute('data-value') === 'true' && selected === true) ||
                        (btn.getAttribute('data-value') === 'false' && selected === false);
                } else {
                    match = (parseInt(btn.getAttribute('data-value')) === selected);
                }
                if (match) btn.classList.add('selected');
            });
            if (userJustification[currentIndex]) {
                const isCorrect = (q.type === "vf") ?
                    (selected === q.correct) :
                    (selected === q.correct);
                feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
                feedbackArea.style.display = 'block';
                feedbackArea.innerHTML = userJustification[currentIndex];
            }
        }
        progressText.innerText = `Questão ${currentIndex+1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function selectAnswer(value) {
        const q = questions[currentIndex];
        let isCorrect = false;
        let correctLabel = '';

        if (q.type === "vf") {
            const isTrue = (value === 'true');
            userAnswers[currentIndex] = isTrue;
            isCorrect = (isTrue === q.correct);
            correctLabel = q.correct ? "Certo" : "Errado";
        } else {
            const idx = parseInt(value);
            userAnswers[currentIndex] = idx;
            isCorrect = (idx === q.correct);
            correctLabel = `Alternativa ${String.fromCharCode(65 + q.correct)}`;
        }

        const explanation = `
            <strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>
            <strong>Justificativa:</strong> ${q.justification}<br>
            <span style="font-size:0.9rem;">Resposta correta: ${correctLabel}.</span>
        `;
        userJustification[currentIndex] = explanation;

        feedbackArea.classList.remove('correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.style.display = 'block';
        feedbackArea.innerHTML = explanation;

        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(btn => btn.classList.remove('selected'));
        const selectedBtn = Array.from(btns).find(btn => btn.getAttribute('data-value') === value);
        if (selectedBtn) selectedBtn.classList.add('selected');
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (btn) selectAnswer(btn.getAttribute('data-value'));
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--;
            renderQuestion(); }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) { currentIndex++;
            renderQuestion(); } else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0;
        let erros = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null) {
                const q = questions[i];
                const isCorrect = (q.type === "vf") ?
                    (userAnswers[i] === q.correct) :
                    (userAnswers[i] === q.correct);
                if (isCorrect) acertos++;
                else erros++;
            }
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let classificacao = '';
        if (nota > 8.5) classificacao = '⭐ Excelente! Você domina o conteúdo!';
        else if (nota >= 7.6) classificacao = '👍 Muito Bom!';
        else if (nota >= 6.6) classificacao = '📘 Bom!';
        else if (nota >= 5.0) classificacao = '📚 Regular';
        else classificacao = '📖 Que tal revisar o conteúdo? Leia com calma e depois refaça o quiz.';

        const resultadoHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
            </div>
        `;
        resultContent.innerHTML = resultadoHTML;
        congratsMsg.innerText = `🏆 ${classificacao}`;

        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    // Refazer o quiz
    restartQuizBtn.addEventListener('click', () => {
        userAnswers = new Array(total).fill(null);
        userJustification = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    setFontSize(16);
</script>
</body>
</html>
