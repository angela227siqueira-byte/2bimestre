<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Geografia · Energia, Meio Ambiente e Sustentabilidade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        /* Página de Introdução */
        .intro-card {
            text-align: center;
        }
        .intro-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 20px;
        }
        .intro-card .revisao {
            font-size: 1.4rem;
            color: #2a5e4a;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .intro-card .professora {
            font-size: 1.2rem;
            color: #1a5e44;
            margin-bottom: 40px;
            font-style: italic;
        }
        .intro-card .btn-iniciar {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .intro-card .btn-iniciar:hover {
            background: #0f4a35;
            transform: scale(1.02);
        }

        /* Tela do Quiz */
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 8px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 0.9rem;
        }
        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a5e44;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #dee6e1;
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            background: #1a7a58;
            height: 8px;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
            background: #f0f7f3;
            padding: 20px;
            border-radius: 20px;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .opt-btn {
            background: #ecf3ef;
            border: 2px solid #b3cdbf;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            min-width: 150px;
            font-family: inherit;
        }
        .opt-btn:hover { background: #dce8e0; transform: scale(1.02); }
        .opt-btn.selected-true { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.selected-false { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .hidden { display: none; }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 10px;
            padding-top: 15px;
            border-top: 1px solid #dde5e0;
        }
        .tool-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .tool-btn:hover { background: #dce8e0; }
        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Tela de Resultado */
        .result-screen { text-align: center; }
        .result-box {
            background: #f0f7f3;
            padding: 25px;
            border-radius: 28px;
            margin: 20px 0;
        }
        .restart-btn {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        hr { margin: 15px 0; border-color: #c0d9ce; }

        @media (max-width: 640px) {
            .quiz-wrapper { max-width: 100%; padding: 15px; }
            .opt-btn { padding: 10px 20px; min-width: 120px; font-size: 1rem; }
            .toolbar { gap: 8px; }
            .tool-btn { padding: 8px 14px; font-size: 0.85rem; }
            .question-text { font-size: 1rem; padding: 15px; }
            .title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <!-- TELA DE INTRODUÇÃO -->
    <div id="introScreen" class="screen active intro-card">
        <h1>🌍 Energia, Meio Ambiente e Sustentabilidade</h1>
        <div class="revisao">Revisão - páginas 48 a 75</div>
        <div class="professora">Angela Siqueira</div>
        <button class="btn-iniciar" id="startQuizBtn">▶ Iniciar Quiz</button>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen">
        <div class="title">🎯 Verdadeiro ou Falso?</div>
        <div class="sub">30 afirmações sobre Energia, Meio Ambiente e Sustentabilidade</div>
        
        <div class="progress-row">
            <span id="progressText">Questão 1 de 30</span>
            <span id="scoreDisplay">✅ 0 acertos</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>

        <div id="questionArea">
            <div id="questionText" class="question-text"></div>
            <div class="options" id="optionsArea">
                <button class="opt-btn" id="trueBtn">✅ VERDADEIRO</button>
                <button class="opt-btn" id="falseBtn">❌ FALSO</button>
            </div>
            <div id="feedbackArea" class="feedback hidden"></div>
        </div>

        <div class="toolbar">
            <button class="tool-btn" id="fontMinusBtn">A−</button>
            <button class="tool-btn" id="fontPlusBtn">A+</button>
            <button class="tool-btn" id="fullscreenBtn">⛶ Tela cheia</button>
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    // =================== 30 QUESTÕES (VERDADEIRO ou FALSO) ===================
    // Baseado nos documentos: Energia e Meio Ambiente (páginas 48-57) e Geografia e Sustentabilidade (páginas 58-75)
    const questions = [
        // Questões do documento 1 (Energia e Meio Ambiente - páginas 48-57)
        { text: "A queima de combustíveis fósseis é apontada como uma das maiores causas de degradação ambiental, liberando gases de efeito estufa.", answer: true, justification: "O texto afirma que 'A produção e o consumo de energia estão entre as maiores causas de degradação ambiental. A queima de combustíveis fósseis libera gases de efeito estufa'." },
        { text: "A corrente 'zerista' da década de 1970 defendia o crescimento econômico acelerado como solução para os problemas ambientais.", answer: false, justification: "A corrente 'zerista' propunha deter o crescimento econômico para salvar o planeta. Foi superada pelo conceito de desenvolvimento sustentável." },
        { text: "Cerca de 770 milhões de pessoas ainda vivem sem eletricidade no mundo, segundo o texto.", answer: true, justification: "O texto menciona que o acesso universal a serviços essenciais é agravado pelo fato de 770 milhões de pessoas ainda viverem sem eletricidade." },
        { text: "A distribuição dos recursos energéticos é igualitária entre os países, reduzindo tensões geopolíticas.", answer: false, justification: "O texto afirma que 'A distribuição dos recursos energéticos é desigual, moldando a geopolítica global', com concentração em regiões como o Golfo Pérsico." },
        { text: "O Estreito de Ormuz concentra cerca de 20% do petróleo e gás mundial, sendo uma rota estratégica para o abastecimento global.", answer: true, justification: "O texto destaca que o bloqueio do Estreito de Ormuz pelo Irã em 2026 removeu mais de 600 milhões de barris do mercado, disparando os preços do petróleo." },
        { text: "A energia nuclear é responsável por 70% da eletricidade francesa e gera baixas emissões de carbono, mas enfrenta o problema do lixo atômico.", answer: true, justification: "O texto afirma que 'a energia nuclear, responsável por 70% da eletricidade francesa, gera baixas emissões de carbono, mas carrega o fardo do lixo atômico'." },
        { text: "A usina hidrelétrica de Balbina, no Amazonas, é um exemplo de energia limpa sem impactos ambientais significativos.", answer: false, justification: "O texto cita Balbina como exemplo de impacto negativo: reservatórios em áreas planas alagam grandes extensões de floresta, que ao se decompor emite metano, um potente gás de efeito estufa." },
        { text: "O Brasil possui uma matriz energética equilibrada, com quase metade da oferta oriunda de fontes renováveis e baixa dependência externa.", answer: true, justification: "O texto afirma que 'O Brasil possui uma matriz energética equilibrada, com quase metade da oferta oriunda de fontes renováveis, e baixa dependência externa'." },
        { text: "A expansão da energia solar e eólica no Brasil tem ocorrido sem gerar conflitos socioambientais.", answer: false, justification: "O texto menciona que a expansão das energias alternativas gera conflitos, principalmente no Nordeste, onde grandes parques ocupam terras, causam poluição sonora e impactam povos indígenas e quilombolas." },
        { text: "O gasoduto Bolívia-Brasil foi importante para a diversificação da matriz elétrica brasileira com termelétricas a gás natural.", answer: true, justification: "O texto cita que houve diversificação com termelétricas a gás natural após o gasoduto Bolívia-Brasil." },
        
        // Questões do documento 2 (Geografia e Sustentabilidade - páginas 58-75)
        { text: "O efeito estufa natural é um fenômeno essencial para a vida na Terra, pois mantém o planeta aquecido.", answer: true, justification: "O texto afirma que o efeito estufa natural é um 'Fenômeno natural essencial para a vida na Terra' e que 'Sem ele, o planeta seria muito frio'." },
        { text: "A intensificação do efeito estufa é causada exclusivamente por processos naturais, sem relação com a ação humana.", answer: false, justification: "O texto afirma que a 'Ação humana (queima de combustíveis fósseis, desmatamento) aumenta gases' e que 'Industrialização e transportes são grandes fontes de CO2'." },
        { text: "A temperatura global subiu cerca de 0,8°C desde 1980, e há consenso científico de que a ação humana influencia o clima.", answer: true, justification: "O texto afirma que 'Temperatura global subiu 0,8°C desde 1980' e que 'Consenso científico: ação humana influencia o clima'." },
        { text: "Os oceanos sofrem com agrotóxicos, esgoto, plástico e petróleo, além da acidificação causada pela absorção de CO2.", answer: true, justification: "O texto afirma que 'Oceanos recebem agrotóxicos, esgoto, plástico e petróleo' e que 'Acidificação da água (CO2 absorvido) ameaça corais e conchas'." },
        { text: "Os transgênicos (OGMs) são amplamente adotados nos EUA, mas o Protocolo de Cartagena regula a biossegurança dessa tecnologia.", answer: true, justification: "O texto afirma que 'EUA líder mundial' em transgênicos e que o 'Protocolo de Cartagena regula biossegurança'." },
        { text: "O preservacionismo defende o uso sustentável dos recursos naturais para as futuras gerações, permitindo exploração controlada.", answer: false, justification: "O texto define 'Preservacionismo: natureza intocada' e 'Conservacionismo: uso sem desperdício para futuras gerações'. O preservacionismo não permite exploração." },
        { text: "O relatório 'Nosso Futuro Comum' (1987) consolidou o conceito de desenvolvimento sustentável, conciliando crescimento econômico, justiça social e proteção ambiental.", answer: true, justification: "O texto afirma que o relatório 'Nosso Futuro Comum' (1987) apresentou o desenvolvimento sustentável como 'Crescimento econômico com justiça social e proteção ambiental'." },
        { text: "O Protocolo de Kyoto (1997) fixou metas de redução de emissões apenas para países em desenvolvimento.", answer: false, justification: "O texto afirma que 'Kyoto (1997) fixou metas de redução para países ricos' e criou o mercado de créditos de carbono." },
        { text: "O Acordo de Paris (2015) tem como meta limitar o aquecimento global a 1,5°C e permite que cada país defina suas metas nacionais voluntariamente.", answer: true, justification: "O texto afirma que o Acordo de Paris 'Substituiu Kyoto; meta: limitar aquecimento a 1,5°C' e que 'Países definem metas nacionais voluntárias'." },
        { text: "A Convenção da Diversidade Biológica (1992) estabeleceu que os recursos genéticos são patrimônio comum da humanidade, sem soberania nacional.", answer: false, justification: "O texto afirma que a Convenção estabeleceu 'soberania nacional sobre recursos', não patrimônio comum." },
        { text: "A Constituição brasileira de 1988 estabelece que o meio ambiente saudável é um direito fundamental do cidadão.", answer: true, justification: "O texto afirma que 'Constituição de 1988: ambiente saudável é direito fundamental'." },
        { text: "As unidades de conservação de proteção integral permitem o uso indireto dos recursos naturais, como em parques e estações ecológicas.", answer: true, justification: "O texto define 'Proteção Integral: uso indireto (parques, estações ecológicas)' e 'Uso Sustentável: exploração controlada'." },
        { text: "A Política Nacional de Resíduos Sólidos (2010) estabeleceu a eliminação imediata de todos os lixões no Brasil.", answer: false, justification: "O texto afirma que a política estabeleceu 'Metas: redução, reciclagem, eliminação de lixões', mas não imediatamente, e sim um plano gradual." },
        
        // Questões sobre Antropoceno e recursos naturais (páginas do documento 2)
        { text: "O Antropoceno é uma nova época geológica proposta para marcar o período em que a ação humana se torna comparável às forças da natureza.", answer: true, justification: "O texto define o Antropoceno como 'uma nova época geológica proposta para marcar o período em que a ação humana se torna tão intensa e extensa que compete com as forças da natureza'." },
        { text: "A União Internacional de Ciências Geológicas (IUGS) aprovou oficialmente o Antropoceno como nova época geológica em março de 2024.", answer: false, justification: "O texto afirma que a IUGS não aprovou até março de 2024 devido à 'dificuldade de determinar um marco global único para o início dessa época'." },
        { text: "Recursos naturais renováveis são aqueles cuja exploração não ocorre em ritmo mais intenso que o de sua reposição pela natureza.", answer: true, justification: "O texto define: 'Recursos renováveis são aqueles cuja exploração não ocorre em ritmo mais intenso que o de sua reposição pela natureza ou pelo trabalho humano'." },
        { text: "O ritmo atual de exploração de recursos renováveis é sustentável, pois a tecnologia permite a regeneração infinita desses recursos.", answer: false, justification: "O texto alerta que 'O aumento da capacidade técnica de extração e a exploração intensiva têm feito com que muitos recursos renováveis fiquem próximos do esgotamento'." },
        
        // Questões sobre Rios Voadores e Fast Fashion (páginas do documento 2)
        { text: "Os 'rios voadores' são correntes de ar carregadas de vapor d'água provenientes do Oceano Atlântico e da evapotranspiração da Floresta Amazônica.", answer: true, justification: "O texto define os 'rios voadores' como 'correntes de ar carregadas de vapor d'água provenientes do Oceano Atlântico e da evapotranspiração da Floresta Amazônica'." },
        { text: "O desmatamento da Amazônia não afeta o regime de chuvas nas regiões Sudeste, Centro-Oeste e Sul do Brasil.", answer: false, justification: "O texto afirma que 'A preservação da Floresta Amazônica é fundamental para esse sistema' e que 'O desmatamento reduz esse fluxo, causando secas nas regiões antes beneficiadas'." },
        { text: "O modelo Fast Fashion prioriza o design durável, tecidos menos agressivos ao meio ambiente e maior ciclo de vida dos produtos.", answer: false, justification: "O texto afirma que 'O Fast Fashion é um modelo de produção e consumo em que as roupas são produzidas em grande escala, com baixa qualidade' e que o Slow Fashion prioriza design durável e tecidos menos agressivos." },
        { text: "Cerca de 35% das micro e nanopartículas de plástico nos oceanos vêm de roupas com tecidos sintéticos, que se soltam durante a lavagem.", answer: true, justification: "O texto afirma que 'cerca de 35% das micro e nanopartículas de plástico nos oceanos vêm de roupas com tecidos sintéticos, que se soltam na água durante a lavagem'." },
        { text: "O relatório 'Os limites do crescimento' (1971), do Clube de Roma, defendia que não há limites para o crescimento econômico e populacional.", answer: false, justification: "O texto afirma que o relatório 'defendia que o planeta tem recursos finitos e que o crescimento exponencial da população e da produção econômica levaria a um colapso iminente'." },
        { text: "Os Objetivos de Desenvolvimento Sustentável (ODS) da ONU abrangem simultaneamente erradicação da pobreza, igualdade de gênero, energia limpa, consumo responsável e proteção da vida terrestre e marinha.", answer: true, justification: "O texto afirma que os ODS 'incorporam essa perspectiva ao abranger simultaneamente erradicação da pobreza, igualdade de gênero, energia limpa, consumo responsável, ação contra a mudança global do clima e proteção da vida terrestre e marinha'." }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let quizFontSize = 16;

    // Elementos DOM
    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const questionText = document.getElementById('questionText');
    const feedbackArea = document.getElementById('feedbackArea');
    const trueBtn = document.getElementById('trueBtn');
    const falseBtn = document.getElementById('falseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const resultContent = document.getElementById('resultContent');
    const fontMinusBtn = document.getElementById('fontMinusBtn');
    const fontPlusBtn = document.getElementById('fontPlusBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Função para atualizar contador de acertos
    function updateScoreDisplay() {
        let correctCount = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].answer) {
                correctCount++;
            }
        }
        scoreDisplay.textContent = `✅ ${correctCount} acertos`;
    }

    // Aplicar fonte no quiz
    function applyQuizFontSize() {
        const container = document.querySelector('.quiz-wrapper');
        container.style.fontSize = quizFontSize + 'px';
    }

    fontMinusBtn.addEventListener('click', () => {
        if (quizFontSize > 12) {
            quizFontSize -= 2;
            applyQuizFontSize();
        }
    });
    fontPlusBtn.addEventListener('click', () => {
        if (quizFontSize < 36) {
            quizFontSize += 2;
            applyQuizFontSize();
        }
    });
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    function resetButtonStyles() {
        trueBtn.classList.remove('selected-true', 'correct-show', 'wrong-show');
        falseBtn.classList.remove('selected-false', 'correct-show', 'wrong-show');
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = q.text;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';
        resetButtonStyles();

        const selectedValue = userAnswers[currentIndex];
        if (selectedValue !== null) {
            highlightSelected(selectedValue);
            showFeedback(selectedValue);
        }

        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        const progressPercent = ((currentIndex + 1) / total) * 100;
        progressFill.style.width = progressPercent + '%';
        
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
        
        updateScoreDisplay();
    }

    function highlightSelected(isTrue) {
        resetButtonStyles();
        if (isTrue === true) {
            trueBtn.classList.add('selected-true');
        } else {
            falseBtn.classList.add('selected-false');
        }
    }

    function showFeedback(selectedValue) {
        const q = questions[currentIndex];
        const isCorrect = (selectedValue === q.answer);
        
        resetButtonStyles();
        
        if (q.answer === true) {
            trueBtn.classList.add('correct-show');
        } else {
            falseBtn.classList.add('correct-show');
        }
        
        if (!isCorrect) {
            if (selectedValue === true) {
                trueBtn.classList.add('wrong-show');
            } else {
                falseBtn.classList.add('wrong-show');
            }
        } else {
            if (selectedValue === true) {
                trueBtn.classList.add('correct-show');
            } else {
                falseBtn.classList.add('correct-show');
            }
        }
        
        const respostaCorreta = q.answer ? "VERDADEIRO" : "FALSO";
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = `
            <strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>
            ${q.justification}<br>
            <span style="font-size:0.9rem;">Resposta correta: <strong>${respostaCorreta}</strong>.</span>
        `;
    }

    function selectAnswer(value) {
        if (userAnswers[currentIndex] !== null) return;
        userAnswers[currentIndex] = value;
        highlightSelected(value);
        showFeedback(value);
        updateScoreDisplay();
    }

    trueBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            selectAnswer(true);
        }
    });
    
    falseBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            selectAnswer(false);
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('⚠️ Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            mostrarResultado();
        }
    });

    function mostrarResultado() {
        let acertos = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] === questions[i].answer) acertos++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina o conteúdo sobre Energia, Meio Ambiente e Sustentabilidade. Parabéns!";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Estude os tópicos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia as seções sobre os temas que teve mais dificuldade.";
        else mensagem = "📚 Que tal revisar os capítulos 48 a 75? Leia com calma e depois refaça o quiz.";

        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${total - acertos} de ${total}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr>
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function reiniciarQuiz() {
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        introScreen.classList.add('active');
    }

    restartQuizBtn.addEventListener('click', reiniciarQuiz);
    
    startQuizBtn.addEventListener('click', () => {
        introScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    applyQuizFontSize();
</script>
</body>
</html>
