<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · História · Capítulos 9 e 10 · Verdadeiro ou Falso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        /* Página de Introdução */
        .intro-card {
            text-align: center;
        }
        .intro-card h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 20px;
        }
        .intro-card .revisao {
            font-size: 1.4rem;
            color: #2a5e4a;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .intro-card .professora {
            font-size: 1.2rem;
            color: #1a5e44;
            margin-bottom: 40px;
            font-style: italic;
        }
        .intro-card .btn-iniciar {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .intro-card .btn-iniciar:hover {
            background: #0f4a35;
            transform: scale(1.02);
        }

        /* Tela do Quiz */
        .title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 8px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
        }
        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a5e44;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #dee6e1;
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            background: #1a7a58;
            height: 8px;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
            background: #f0f7f3;
            padding: 20px;
            border-radius: 20px;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .opt-btn {
            background: #ecf3ef;
            border: 2px solid #b3cdbf;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            min-width: 150px;
            font-family: inherit;
        }
        .opt-btn:hover { background: #dce8e0; transform: scale(1.02); }
        .opt-btn.selected-true { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.selected-false { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .hidden { display: none; }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 10px;
            padding-top: 15px;
            border-top: 1px solid #dde5e0;
        }
        .tool-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .tool-btn:hover { background: #dce8e0; }
        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Tela de Resultado */
        .result-screen { text-align: center; }
        .result-box {
            background: #f0f7f3;
            padding: 25px;
            border-radius: 28px;
            margin: 20px 0;
        }
        .restart-btn {
            background: #1a5e44;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        hr { margin: 15px 0; border-color: #c0d9ce; }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 640px) {
            .quiz-wrapper { max-width: 100%; padding: 15px; }
            .opt-btn { padding: 10px 20px; min-width: 120px; font-size: 1rem; }
            .toolbar { gap: 8px; }
            .tool-btn { padding: 8px 14px; font-size: 0.85rem; }
            .question-text { font-size: 1rem; padding: 15px; }
        }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <!-- TELA DE INTRODUÇÃO -->
    <div id="introScreen" class="screen active intro-card">
        <h1>📘 A consolidação do Estado brasileiro</h1>
        <div class="revisao">Revisão dos Capítulos 9 e 10</div>
        <div class="professora">Angela Siqueira</div>
        <button class="btn-iniciar" id="startQuizBtn">▶ Iniciar Quiz</button>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen">
        <div class="title">🎯 Verdadeiro ou Falso?</div>
        <div class="sub">30 afirmações sobre Independências na América e Brasil Império</div>
        
        <div class="progress-row">
            <span id="progressText">Questão 1 de 30</span>
            <span id="scoreDisplay">✅ 0 acertos</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>

        <div id="questionArea">
            <div id="questionText" class="question-text"></div>
            <div class="options" id="optionsArea">
                <button class="opt-btn" id="trueBtn">✅ VERDADEIRO</button>
                <button class="opt-btn" id="falseBtn">❌ FALSO</button>
            </div>
            <div id="feedbackArea" class="feedback hidden"></div>
        </div>

        <div class="toolbar">
            <button class="tool-btn" id="fontMinusBtn">A−</button>
            <button class="tool-btn" id="fontPlusBtn">A+</button>
            <button class="tool-btn" id="fullscreenBtn">⛶ Tela cheia</button>
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    // =================== 30 QUESTÕES (VERDADEIRO ou FALSO) ===================
    const questions = [
        { text: "As Reformas Bourbônicas, implementadas pela Coroa espanhola no século XVIII, incluíram a expulsão dos jesuítas e visavam aumentar o controle da Coroa sobre a administração colonial.", answer: true, justification: "As Reformas Bourbônicas buscaram centralizar o poder e aumentar a arrecadação de impostos, e a expulsão dos jesuítas foi uma medida para fortalecer o controle real sobre as colônias." },
        { text: "A 'Lei do Selo' de 1765 foi revogada porque a Grã-Bretanha decidiu fortalecer voluntariamente a economia das Treze Colônias.", answer: false, justification: "A Lei do Selo foi revogada devido à forte pressão e aos boicotes organizados pelos colonos americanos, que consideravam a lei uma afronta aos seus direitos." },
        { text: "A Revolução Haitiana (1791-1804) foi o único caso na história da América em que escravizados e ex-escravizados lideraram a libertação da dominação colonial.", answer: true, justification: "O Haiti conquistou sua independência através de uma revolta liderada por escravizados e ex-escravizados, um caso único nas Américas." },
        { text: "O 'Grito de Dolores', liderado por Miguel Hidalgo em 1810, ocorreu no Vice-Reino da Nova Espanha, atual México.", answer: true, justification: "O movimento de independência mexicano teve início com o Grito de Dolores, na Intendência de Guanajuato, localizada no Vice-Reino da Nova Espanha." },
        { text: "A Constituição de Cádiz (1812) defendia o poder absoluto do rei e a manutenção dos privilégios da nobreza.", answer: false, justification: "A Constituição de Cádiz estabeleceu princípios liberais como soberania da nação, sufrágio masculino e liberdade de imprensa." },
        { text: "O termo 'haitianismo' foi utilizado para descrever o medo que as elites escravistas americanas tinham de que revoltas de cativos se espalhassem.", answer: true, justification: "O 'haitianismo' representava o temor das elites de que a revolução haitiana servisse de exemplo para revoltas em outras regiões escravistas." },
        { text: "Após a Guerra da Cisplatina (1825-1828), a Banda Oriental foi anexada permanentemente ao Império Brasileiro.", answer: false, justification: "Ao final da guerra, a Banda Oriental conquistou sua independência, constituindo a República Oriental do Uruguai." },
        { text: "O movimento de independência liderado por Miguel Hidalgo no México reuniu indígenas, mestiços e trabalhadores pobres, o que assustou a elite criolla.", answer: true, justification: "A composição social do movimento de Hidalgo era diversa e popular, causando temor entre as elites." },
        { text: "Durante as independências da América espanhola, as mulheres atuaram apenas como enfermeiras nos hospitais de campanha.", answer: false, justification: "As mulheres participaram ativamente como espiãs, mensageiras, financiadoras e, em alguns casos, comandaram batalhões." },
        { text: "O Congresso do Panamá (1826), convocado por Simón Bolívar, foi um sucesso absoluto e criou uma confederação duradoura.", answer: false, justification: "O Congresso do Panamá não foi instituído devido a interesses divergentes entre as nações, incluindo o Brasil que não participou." },
        { text: "A Constituição de 1824, outorgada por dom Pedro I, criou o Poder Moderador, que permitia ao imperador dissolver a Câmara dos Deputados e vetar leis.", answer: true, justification: "O Poder Moderador era um dos quatro poderes do Império e dava amplos poderes ao imperador sobre os demais poderes." },
        { text: "A Confederação do Equador (1824) foi um movimento que defendia a centralização monárquica e o autoritarismo de dom Pedro I.", answer: false, justification: "A Confederação do Equador foi um movimento republicano e federalista que contestava o autoritarismo do imperador." },
        { text: "A Lei de Terras de 1850 dificultou o acesso à terra para pequenos agricultores, posseiros e libertos, garantindo mão de obra para os cafeicultores.", answer: true, justification: "A Lei de Terras estabeleceu que terras devolutas só poderiam ser adquiridas mediante compra, excluindo pequenos agricultores e libertos." },
        { text: "A Revolta dos Malês (1835), em Salvador, foi um levante de escravizados e libertos que seguiam a fé islâmica.", answer: true, justification: "Os malês eram africanos islamizados que se uniram na contestação da escravidão." },
        { text: "Durante o Segundo Reinado, liberais e conservadores tinham origens sociais e métodos para obter votos completamente distintos.", answer: false, justification: "Liberais e conservadores partilhavam a origem social, a formação educacional e os métodos violentos e clientelistas para obter votos." },
        { text: "O Instituto Histórico e Geográfico Brasileiro (IHGB) promoveu um discurso oficial que idealizava o indígena e apagava a importância dos povos africanos.", answer: true, justification: "O IHGB construiu uma identidade nacional baseada na idealização do indígena e no apagamento da escravidão e da cultura africana." },
        { text: "A Lei Eusébio de Queirós (1850) aboliu imediatamente a escravidão em todo o território brasileiro.", answer: false, justification: "A Lei Eusébio de Queirós proibiu o tráfico transatlântico de africanos escravizados, não a escravidão em si." },
        { text: "A Lei do Ventre Livre (1871) determinava que os filhos de escravizadas nascidos a partir daquela data seriam livres.", answer: true, justification: "A Lei do Ventre Livre declarava livres os filhos de escravizadas, mas eles ficavam sob tutela dos senhores até os 21 anos." },
        { text: "A Lei dos Sexagenários (1885) libertava escravizados com mais de 60 anos, uma medida considerada eficaz pelos abolicionistas.", answer: false, justification: "Os abolicionistas criticaram a lei porque a expectativa de vida dos escravizados era muito baixa, poucos alcançavam os 60 anos." },
        { text: "A Lei Áurea (1888) extinguiu a escravidão e concedeu terras e indenizações aos libertos.", answer: false, justification: "A Lei Áurea libertou cerca de 700 mil pessoas, mas não ofereceu garantias de moradia, emprego, terras ou educação." },
        { text: "Na Bahia, a independência do Brasil é celebrada em 7 de setembro e também em 2 de julho, data da derrota final das tropas portuguesas.", answer: true, justification: "Em 2 de julho de 1823, ocorreu a derrota final das tropas portuguesas em Salvador, marcando o fim da Guerra de Independência na Bahia." },
        { text: "A Cabanagem (Grão-Pará) foi um movimento liderado exclusivamente pela elite agrária contra os altos impostos.", answer: false, justification: "A Cabanagem foi um movimento popular com participação de indígenas, mestiços e negros pobres." },
        { text: "A Revolução Farroupilha (1835-1845) proclamou a República Rio-Grandense e contou com a participação de Garibaldi e Anita.", answer: true, justification: "Os farrapos proclamaram a República Rio-Grandense em 1836 e tiveram apoio de Giuseppe Garibaldi e Anita Garibaldi." },
        { text: "A Sabinada (1837-1838) foi um movimento que defendia a volta da monarquia e o fim da república provisória na Bahia.", answer: false, justification: "A Sabinada foi um movimento republicano que queria uma república provisória até a maioridade de dom Pedro II." },
        { text: "A Balaiada (Maranhão, 1838-1841) foi sufocada pelo futuro duque de Caxias e resultou em milhares de mortos.", answer: true, justification: "A Balaiada foi reprimida violentamente por Caxias, com cerca de 12 mil mortos." },
        { text: "O Golpe da Maioridade (1840) antecipou a maioridade de dom Pedro II para que ele pudesse governar aos 15 anos.", answer: true, justification: "Liberais promoveram o Golpe da Maioridade para que dom Pedro II assumisse o trono antes dos 18 anos." },
        { text: "A Guerra do Paraguai (1864-1870) fortaleceu o Exército brasileiro e aumentou a dívida do império.", answer: true, justification: "O conflito deixou o Exército fortalecido politicamente, mas endividou o império." },
        { text: "Dom Pedro II foi proclamado imperador imediatamente após a abdicação de seu pai, sem necessidade de regência.", answer: false, justification: "Após a abdicação de dom Pedro I, seu filho tinha apenas 5 anos, iniciando-se o Período Regencial (1831-1840)." },
        { text: "A fotografia chegou ao Brasil em 1840 e foi incentivada por dom Pedro II, que gostava de registrar a sociedade imperial.", answer: true, justification: "Dom Pedro II foi um entusiasta da fotografia, incentivando sua difusão no Brasil." },
        { text: "A Proclamação da República (1889) foi um movimento amplamente apoiado pela população brasileira, que participou ativamente das ruas.", answer: false, justification: "Segundo Aristides Lobo, o povo 'assistiu àquilo bestializado', sem participação popular significativa no golpe militar." }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let quizFontSize = 16;

    // Elementos DOM
    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const questionText = document.getElementById('questionText');
    const feedbackArea = document.getElementById('feedbackArea');
    const trueBtn = document.getElementById('trueBtn');
    const falseBtn = document.getElementById('falseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const resultContent = document.getElementById('resultContent');
    const fontMinusBtn = document.getElementById('fontMinusBtn');
    const fontPlusBtn = document.getElementById('fontPlusBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Função para atualizar contador de acertos
    function updateScoreDisplay() {
        let correctCount = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].answer) {
                correctCount++;
            }
        }
        scoreDisplay.textContent = `✅ ${correctCount} acertos`;
    }

    // Aplicar fonte no quiz
    function applyQuizFontSize() {
        const container = document.querySelector('.quiz-wrapper');
        container.style.fontSize = quizFontSize + 'px';
    }

    fontMinusBtn.addEventListener('click', () => {
        if (quizFontSize > 12) {
            quizFontSize -= 2;
            applyQuizFontSize();
        }
    });
    fontPlusBtn.addEventListener('click', () => {
        if (quizFontSize < 36) {
            quizFontSize += 2;
            applyQuizFontSize();
        }
    });
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    function resetButtonStyles() {
        trueBtn.classList.remove('selected-true', 'correct-show', 'wrong-show');
        falseBtn.classList.remove('selected-false', 'correct-show', 'wrong-show');
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = q.text;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';
        resetButtonStyles();

        const selectedValue = userAnswers[currentIndex];
        if (selectedValue !== null) {
            highlightSelected(selectedValue);
            showFeedback(selectedValue);
        }

        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        const progressPercent = ((currentIndex + 1) / total) * 100;
        progressFill.style.width = progressPercent + '%';
        
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
        
        updateScoreDisplay();
    }

    function highlightSelected(isTrue) {
        resetButtonStyles();
        if (isTrue === true) {
            trueBtn.classList.add('selected-true');
        } else {
            falseBtn.classList.add('selected-false');
        }
    }

    function showFeedback(selectedValue) {
        const q = questions[currentIndex];
        const isCorrect = (selectedValue === q.answer);
        
        resetButtonStyles();
        
        if (q.answer === true) {
            trueBtn.classList.add('correct-show');
        } else {
            falseBtn.classList.add('correct-show');
        }
        
        if (!isCorrect) {
            if (selectedValue === true) {
                trueBtn.classList.add('wrong-show');
            } else {
                falseBtn.classList.add('wrong-show');
            }
        } else {
            if (selectedValue === true) {
                trueBtn.classList.add('correct-show');
            } else {
                falseBtn.classList.add('correct-show');
            }
        }
        
        const respostaCorreta = q.answer ? "VERDADEIRO" : "FALSO";
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = `
            <strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>
            ${q.justification}<br>
            <span style="font-size:0.9rem;">Resposta correta: <strong>${respostaCorreta}</strong>.</span>
        `;
    }

    function selectAnswer(value) {
        if (userAnswers[currentIndex] !== null) return;
        userAnswers[currentIndex] = value;
        highlightSelected(value);
        showFeedback(value);
        updateScoreDisplay();
    }

    trueBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            selectAnswer(true);
        }
    });
    
    falseBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            selectAnswer(false);
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('⚠️ Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            mostrarResultado();
        }
    });

    function mostrarResultado() {
        let acertos = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] === questions[i].answer) acertos++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina o conteúdo dos capítulos 9 e 10. Parabéns!";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Estude os tópicos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia as seções sobre os temas que teve mais dificuldade.";
        else mensagem = "📚 Que tal revisar os capítulos? Leia com calma e depois refaça o quiz.";

        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${total - acertos} de ${total}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr>
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function reiniciarQuiz() {
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        introScreen.classList.add('active');
    }

    restartQuizBtn.addEventListener('click', reiniciarQuiz);
    
    startQuizBtn.addEventListener('click', () => {
        introScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    applyQuizFontSize();
</script>
</body>
</html>
